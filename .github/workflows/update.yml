name: update-data
on:
  schedule:
    - cron: "30 22 * * *"  # 매일 22:30 UTC = 07:30 KST(다음 날). cron은 UTC 기준. ECB 환율(유럽 오후 4시경 발표)·Tesouro 일일 갱신 이후 → 전 영업일 값까지 반영
    - cron: "30 10 * * *"  # 보조 실행 19:30 KST — 아침 실행 실패·지연 만회
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: tt-cache-${{ github.run_id }}
          restore-keys: tt-cache-
      - run: python3 -I update.py
      - name: 신호 알림(새로 켜진 매수 지표·손절 규칙만, 일반 문구 이슈)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUY_REAL: ${{ vars.BUY_REAL }}
          STOP_REAL: ${{ vars.STOP_REAL }}
          TARGET_REAL: ${{ vars.TARGET_REAL }}
        run: python3 -I notify.py --actions
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/fx_brlkrw.csv
          git diff --cached --quiet || (git commit -m "data: daily update $(date -u +%F)" && git push)
