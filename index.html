<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PF32 Dashboard</title>
<style>
:root{--bg:#e8e8e8;--paper:#fff;--ink:#000;--soft:#f3f3f1;--line:rgba(0,0,0,.18);--up:#000}
@media (prefers-color-scheme:dark){:root{--bg:#111;--paper:#1b1b1b;--ink:#f2f2f2;--soft:#262626;--line:rgba(255,255,255,.22)}}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13px}
.mono,.mono *{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;gap:8px;align-items:center;padding:6px 12px;flex-wrap:wrap}
header .logo{background:var(--ink);color:var(--paper);font-weight:900;padding:2px 8px}
header .meta{font-size:11px;opacity:.7;flex:1;min-width:160px}
button{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:5px 10px;font-size:12px;cursor:pointer;font-weight:700}
button.pri{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.5;cursor:wait}
nav{display:flex;gap:0;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--ink)}
nav button{border:0;border-right:1px solid var(--line);padding:8px 14px;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--paper)}
main{max-width:1000px;margin:12px auto;padding:0 12px 40px}
section{background:var(--paper);border:1px solid var(--ink);margin-bottom:12px}
section>h2{margin:0;padding:5px 10px;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:.06em}
.body{padding:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-size:11px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{border:1px solid var(--ink);padding:8px 10px}
.card small{display:block;opacity:.65;font-size:10px;letter-spacing:.08em}
.card b{font-size:20px}
.tag{display:inline-block;border:1px solid var(--ink);padding:0 5px;font-size:10px;font-weight:700}
.tag.inv{background:var(--ink);color:var(--paper)}
.bar{display:flex;height:40px;border:1px solid var(--ink)}
.bar>div{display:flex;flex-direction:column;justify-content:center;padding:0 8px;border-right:1px solid var(--ink);font-size:11px;overflow:hidden}
.bar>.f{background:var(--ink);color:var(--paper)}
.warn{border:1px dashed var(--ink);padding:6px 8px;margin-top:8px;font-size:12px}
.note{font-size:11px;opacity:.7;margin-top:6px;line-height:1.5}
.rng{position:relative;height:18px;border:1px solid var(--ink);margin:14px 0 4px}
.rng i{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink)}
.rng em{position:absolute;top:18px;font-size:10px;font-style:normal;transform:translateX(-50%);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.kv label{font-size:11px;opacity:.7}
input{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:4px 6px;font-size:13px;width:100%}
input[type=checkbox]{width:auto}
#log{white-space:pre-wrap;font-size:10px;opacity:.7;margin-top:6px;max-height:120px;overflow:auto}
svg text{fill:var(--ink);font-size:10px}
.hidden{display:none}
@page{size:A4;margin:10mm}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}section{break-inside:auto}.view{display:block!important}
  main,#app,section,.body{max-width:100%!important;overflow:visible!important}
  .tbl{overflow:visible!important}
  table{width:100%!important;table-layout:auto;font-size:9px!important}
  th,td{white-space:normal!important;min-width:0!important;padding:3px 3px!important;word-break:keep-all}
  td[style*="min-width"]{min-width:0!important}
  input{width:46px!important;font-size:9px!important;padding:1px 2px!important}
  td.r{white-space:nowrap!important}
  tr{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <span class="logo mono">PF32</span>
  <span class="meta mono" id="meta">로딩 중…</span>
  <button id="btnCsv" title="rendimento-investir CSV 올리기">📂 CSV</button><input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <button class="pri" id="btnUpdate">⟳ 지금 업데이트</button>
  <button onclick="print()">🖨 인쇄(A4)</button>
</header>
<nav id="nav"></nav>
<main>
  <div id="log" class="mono hidden"></div>
  <div id="app"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const f2 = (n, d = 2) => n == null || isNaN(n) ? "—" : n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (n, d = 2) => n == null || isNaN(n) ? "—" : (n >= 0 ? "+" : "") + f2(n, d) + "%";
const brDate = iso => iso ? iso.slice(8) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "—";
let D, C, tab = localStorage.getItem("tab") || "overview";

const TABS = [["overview","01 최신변동"],["stages","02 분할매수"],["fx","03 환율"],["scen","04 시나리오"],["port","05 5:5 포트폴리오"],["bonds","06 국채 전체"],["settings","설정"]];

const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
async function jget(u) { try { const r = await fetch(u + "?" + Date.now()); return r.ok ? await r.json() : null; } catch (e) { return null; } }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
async function load() {
  D = await jget("data/data.json");
  if (!D) throw new Error("data/data.json 없음");
  C = await jget("config.json");
  const loc = await jget("config.local.json"); if (loc) C = {...C, ...loc};   // 개인 설정(로컬 서버 전용, git 제외)
  const ls = lsGet("pf32cfg"); if (ls) C = {...C, ...ls};                    // 이 기기 브라우저 설정
  const lv = lsGet("pf32live");                                              // 직접 올린 Investir CSV
  if (lv && (!D.live_info || lv.info.mtime >= D.live_info.mtime)) { D.live = lv.rows; D.live_info = lv.info; }
  render();
}
function parseNum(s) { s = s.replace(/R\$|%|\u00a0|\s/g, ""); return s.includes(",") ? parseFloat(s.replace(/\./g, "").replace(",", ".")) : parseFloat(s); }
function parseInvestir(txt) {
  const L = txt.replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean); L.shift();
  return L.map(l => { const c = l.split(";"), name = c[0].trim(), p = name.split(" ");
    const tipo = /^\d+$/.test(p.at(-1)) ? p.slice(0, -1).join(" ") : name, ry = c[1].trim();
    return {name, key: tipo + "|" + c[4].trim(), yield_text: ry, rate: ry === "SELIC" ? null : parseNum(ry.split("+").pop()), min_invest: parseNum(c[2]), pu: parseNum(c[3]), venc: c[4].trim()}; });
}
async function uploadCsv(file) {
  const rows = parseInvestir(await file.text());
  if (!rows.length || rows.some(r => isNaN(r.pu))) { alert("rendimento-investir CSV 형식이 아닙니다."); return; }
  const t = file.lastModified, loc = d => new Date(d - new Date(d).getTimezoneOffset() * 60000).toISOString();
  const info = {file: file.name, mtime: loc(t).slice(0, 16), uploaded: loc(Date.now()).slice(0, 16)};   // mtime=파일 수정 시각, uploaded=내가 이 기기에서 올린 시각
  try { localStorage.setItem("pf32live", JSON.stringify({info, rows})); } catch (e) {}
  await load();
}

// ---------- 시각 표기 (모두 한국 시간) ----------
// 시간대(+09:00/Z 등)가 붙은 값은 KST로 변환, 붙지 않은 값(파일 수정 시각 등 이 기기 로컬)은 그대로 표시
const hasTz = s => /([zZ]|[+-]\d{2}:?\d{2})$/.test(s || "");
function kst(s) {
  if (!s) return "—";
  if (!hasTz(s)) return s.replace("T", " ").slice(0, 16) + (s.length > 16 ? "" : "");
  const f = new Intl.DateTimeFormat("sv-SE", {timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"});
  return f.format(new Date(s)).replace(",", "");
}
const ageTxt = s => { if (!s) return ""; const ms = Date.now() - new Date(s).getTime(); if (isNaN(ms) || ms < 0) return ""; const h = ms / 36e5;
  return h < 1 ? `${Math.max(1, Math.round(ms / 6e4))}분 전` : h < 48 ? `${Math.round(h)}시간 전` : `${Math.round(h / 24)}일 전`; };
function timesPanel(m) {
  const li = D.live_info, last = (D.series[C.tracked.label] || []).at(-1);
  const row = (a, b, c) => `<tr><td>${a}</td><td class=mono>${b}</td><td><small>${c}</small></td></tr>`;
  const old = li && (Date.now() - new Date(li.mtime).getTime()) > 24 * 36e5;
  const btn = `<button class=noprint style="margin-top:10px" onclick="showTimes=!showTimes;render()">🕒 데이터 시각 ${showTimes ? "닫기 ▲" : "보기 ▼"}</button>`;
  if (!showTimes) return btn;
  return `${btn}<div style="margin-top:6px"><b>데이터 시각 (한국 시간) — 서로 다른 시각을 구분</b>
    <div class=tbl><table><tbody>
    ${row("자동 갱신 실행", kst(D.generated) + (hasTz(D.generated) ? "" : " ※"), "서버(Mac 07:00 / GitHub 07:30 KST)가 이 데이터를 만든 시각" + (hasTz(D.generated) ? "" : " · ※ 시간대 정보 없는 옛 데이터(다음 갱신부터 정확히 표기)"))}
    ${row("환율 기준일", D.fx.latest ? brDate(D.fx.latest[0]) : "—", "ECB 영업일 기준값 · 실행 시각과 무관(주말·휴일엔 전 영업일)")}
    ${row("국채 CSV 최신 거래일", last ? brDate(last[0]) : "—", "Tesouro Transparente 반영 지연(1~2영업일)")}
    ${li ? row("Investir CSV 파일 작성", li.mtime.replace("T", " ") + " <small>(" + ageTxt(li.mtime) + ")</small>" + (old ? " ⚠" : ""), "내가 내려받아 저장한 <b>파일의 수정 시각</b>" + (old ? " · 24시간 넘은 파일" : "")) : row("Investir CSV", "없음", "LIVE 가격 없음 → 국채 CSV 값 표시")}
    ${li ? row("CSV 앱 반영", li.uploaded ? "올림 " + li.uploaded.replace("T", " ") : li.picked ? "자동 반영 " + kst(li.picked) : "—", li.uploaded ? "이 기기에서 [📂 CSV]로 올린 시각 (자동 갱신 시각과 무관, 언제든 가능)" : "자동 갱신이 파일을 집어간 시각") : ""}
    ${li ? row("LIVE 사용", m.useLive ? "사용 중" : "미사용", m.useLive ? "CSV 파일 날짜 ≥ 국채 CSV 최신일 → LIVE 값 우선" : "국채 CSV가 더 최신 → 국채 CSV 값 표시") : ""}
    </tbody></table></div></div>`;
}
let showTimes = false;   // 시각 표는 필요할 때만 펼침

// ---------- 파생 계산 ----------
function model() {
  const t = C.tracked, key = `${t.tipo}|${t.venc}`;
  const hist = D.series[t.label] || [];
  const last = hist.at(-1), prev = hist.at(-2);
  const live = (D.live || []).find(b => b.key === key);
  // 라이브(Investir CSV)가 있고 국채 CSV 최신일보다 새로우면 라이브 우선
  const useLive = live && D.live_info && (!last || D.live_info.mtime.slice(0, 10) >= last[0]);
  const price = useLive ? live.pu : last?.[2];
  const ytm = useLive ? live.rate : last?.[1];
  const before = useLive ? last : prev;
  const fx = D.fx.latest ? D.fx.latest[1] : null;
  const filled = C.stages.filter(s => s.filled);
  const filledPct = filled.reduce((a, s) => a + s.pct, 0);
  const avgOf = st => { const p = st.reduce((a, s) => a + s.pct, 0); return p && st.every(s => s.price > 0) ? st.reduce((a, s) => a + s.price * s.pct, 0) / p : null };
  const next = C.stages.find(s => !s.filled);
  const stagesAssumed = C.stages.map(s => ({...s}));
  return {t, price, ytm, before, fx, useLive, live, last, filledPct, avg: avgOf(filled), avgAll: avgOf(C.stages), next, source: useLive ? "Investir CSV 파일 " + D.live_info.mtime.replace("T", " ") : "Tesouro Transparente " + (last ? brDate(last[0]) : "")};
}
const total = (ytmPct, fxFrom, fxTo) => ((1 + ytmPct / 100) * (fxTo / fxFrom) - 1) * 100;

// ---------- 실질수익률 (인플레 제거, 피셔 방정식) ----------
const real = (nomPct, inflPct) => ((1 + nomPct / 100) / (1 + inflPct / 100) - 1) * 100;
const INF = () => Object.assign({kr: 2.0, us: 2.5, br_manual: 0, usdkrw_assume: 0}, C.infl || {});

// ---------- 정치·재정 시나리오 (PF32 고정금리 vs Selic 연동 vs IPCA+) ----------
// 기본값은 2018·2022 선거, 2024 재정 충격 때의 실제 움직임을 참고한 '가정'이며 예측이 아님. 모두 이 탭에서 직접 수정 가능
const POL_DEF = {
  sel_now: 13.75, sel_spread: 0.0979, ipca_real: 6.83, ipca_venc: "15/08/2032", horizon_note: "10/25 결과 확인 후 매수 → 12개월 보유 후 매도",
  sc: [
    {name: "S1 우파 승리 + 재정 신뢰 회복", side: "우파", prob: 31, dy: -60, sel: 12.3, ipca: 3.8, dr: -30, fx: 5, dy2: -10, dr2: -5, fx2: 1, sp: -25},
    {name: "S2 우파 승리, 개혁 지연(이미 반영)", side: "우파", prob: 47, dy: 0, sel: 12.9, ipca: 4.3, dr: 0, fx: 0, dy2: 0, dr2: 0, fx2: 0, sp: 0},
    {name: "S3 룰라 재선 + 재정 현상유지(2022형)", side: "룰라", prob: 15, dy: 150, sel: 13.4, ipca: 5.0, dr: 75, fx: -7, dy2: 0, dr2: 0, fx2: 0, sp: 60},
    {name: "S4 룰라 재선 + 재정 악화(2024형)", side: "룰라", prob: 7, dy: 250, sel: 14.3, ipca: 6.5, dr: 125, fx: -12, dy2: 0, dr2: 0, fx2: 0, sp: 120}]
};
const POL = () => { const c = C.pol || {}; return {...POL_DEF, ...c, sc: (c.sc && c.sc.length ? c.sc : POL_DEF.sc).map((s, i) => ({...POL_DEF.sc[i], ...s}))}; };
function yearsTo(venc, now = new Date()) { const [d, m, y] = venc.split("/").map(Number); return Math.max(0.1, (new Date(y, m - 1, d) - now) / (365.25 * 864e5)); }
function polCalc(m) {
  const P = POL(), live = k => (D.live || []).find(b => b.key === k);
  const ip = live("Tesouro IPCA+|" + P.ipca_venc), sl = (D.live || []).find(b => /Selic/.test(b.name) && b.rate != null && /2031/.test(b.name));
  const ipReal = ip && ip.rate != null ? ip.rate : P.ipca_real, selSp = sl ? sl.rate : P.sel_spread;
  const Dpf = yearsTo(C.tracked.venc) / (1 + m.ytm / 100), Dip = yearsTo(P.ipca_venc) / (1 + ipReal / 100);
  const tw = P.sc.reduce((a, s) => a + (+s.prob || 0), 0) || 1, kr = INF().kr;
  const rows = P.sc.map(s => {
    const pf = m.ytm - Dpf * s.dy / 100, se = s.sel + selSp, ipc = ((1 + ipReal / 100) * (1 + s.ipca / 100) - 1) * 100 - Dip * s.dr / 100;
    const k = r => ((1 + r / 100) * (1 + s.fx / 100) - 1) * 100;
    // 결과 확인 후 매수: 진입 시점의 금리·환율은 이미 충격(dy·dr·fx)을 반영, 이후 12개월은 추가 변동(dy2·dr2·fx2)만 손익에 반영
    const pf2 = m.ytm + s.dy / 100 - Dpf * s.dy2 / 100, rE = ipReal + s.dr / 100, ipc2 = ((1 + rE / 100) * (1 + s.ipca / 100) - 1) * 100 - Dip * s.dr2 / 100;
    const k2 = r => ((1 + r / 100) * (1 + s.fx2 / 100) - 1) * 100;
    return {...s, w: (+s.prob || 0) / tw, brl: [pf, se, ipc], krw: [k(pf), k(se), k(ipc)], yin: m.ytm + s.dy / 100, brlP: [pf2, se, ipc2], krwP: [k2(pf2), k2(se), k2(ipc2)]};
  });
  const ev = key => [0, 1, 2].map(j => rows.reduce((a, r) => a + r.w * r[key][j], 0));
  const evB = ev("brlP"), evK = ev("krwP"), evKpre = ev("krw");
  const evBest = rows.reduce((a, r) => a + r.w * Math.max(...r.krwP), 0);
  // 룰라 승리 확률을 0~100%로 바꿔 가며(각 진영 안의 배분은 유지) Selic 이 PF32 를 앞서는 지점
  const side = n => rows.filter(r => r.side === n), sh = (r, n) => { const t = side(n).reduce((a, x) => a + x.w, 0) || 1; return r.w / t; };
  let be = null;
  if (side("우파").length && side("룰라").length) for (let pl = 0; pl <= 100; pl++) {
    const e = j => rows.reduce((a, r) => a + (r.side === "룰라" ? pl / 100 : 1 - pl / 100) * sh(r, r.side) * r.krwP[j], 0);
    if (e(1) > e(0)) { be = pl; break; }
  }
  const pLula = side("룰라").reduce((a, r) => a + r.w, 0) * 100;
  return {P, rows, evB, evK, evKpre, evBest, evKR: evK.map(v => real(v, kr)), be, pLula, Dpf, Dip, ipReal, selSp, tw, srcIp: ip ? "CSV" : "기본값", srcSl: sl ? "CSV" : "기본값"};
}
let showPolRef = false, polSel = 1;
function polEdit(el) {
  const path = el.dataset.k.split("."), v = el.type === "number" ? parseFloat(el.value) : el.value;
  if (el.type === "number" && isNaN(v)) return;
  if (!C.pol) C.pol = {}; if (!C.pol.sc) C.pol.sc = POL().sc;
  let o = C; path.slice(0, -1).forEach(p => o = o[p]); o[path.at(-1)] = v;   // path 는 "pol.sc.i.키" → C 에서 시작
  try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {}
  if (LOCAL) fetch("/api/config", {method: "POST", body: JSON.stringify(C)}).catch(() => {});
  render(true);
}
function polReset() { delete C.pol; try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {} if (LOCAL) fetch("/api/config", {method: "POST", body: JSON.stringify(C)}).catch(() => {}); render(); }
// ---------- 달러표시 브라질 채권 (수동 입력 시세, 설정 usd_bonds 로 덮어쓰기 가능) ----------
const USD_ASOF = "10/14";
const USD_DEF = [
  {n: "Brazil 6.25% 2031", cpn: 6.25, mat: "2031.03.18", px: 101.67, ytm: 5.82, sp: 84, dur: 3.81},
  {n: "Brazil 3.75% 2031", cpn: 3.75, mat: "2031.09.12", px: 90.97, ytm: 5.89, sp: 90, dur: 4.36},
  {n: "Brazil 5.5% 2033", cpn: 5.5, mat: "2033.02.04", px: 95.61, ytm: 6.34, sp: 128, dur: 5.17},
  {n: "Brazil 6% 2033", cpn: 6, mat: "2033.10.20", px: 97.97, ytm: 6.36, sp: 127, dur: 5.47},
  {n: "Brazil 6.625% 2035", cpn: 6.625, mat: "2035.03.15", px: 99.60, ytm: 6.68, sp: 155, dur: 6.33}];
let usdSel = 3;
const USD_INC = () => Object.assign({amt: 10000, share: 100, tax: 15.4}, C.usd_inc || {});
function usdEdit(el) {
  const v = parseFloat(el.value); if (isNaN(v)) return;
  if (!C.usd_inc) C.usd_inc = {}; C.usd_inc[el.dataset.k] = v;

      <p class=noprint style="margin:2px 0 6px">${r.rows.map((y, i) => `<button onclick="polSel=${i};render(true)" ${i === polSel ? 'style="font-weight:700;text-decoration:underline"' : ""}>${y.name.split(" ")[0]}</button>`).join(" ")} <small>${x.name} · 진입 YTM ${f2(x.yin, 2)}%</small></p>
      <div class=tbl><table class=mono><thead><tr><th class=r>진입 후 금리</th><th class=r>12개월 후 YTM</th><th class=r>가격 변동</th><th class=r>헤알 손익</th>${fxs.map(f => `<th class=r>원화 손익<br><small>환율 ${f > 0 ? "+" : ""}${f}%</small></th>`).join("")}<th class=r>실질(원)<br><small>환율 0%</small></th></tr></thead><tbody>
      ${bps.map(b => { const brl = x.yin - r.Dpf * b / 100, k = f => ((1 + brl / 100) * (1 + f / 100) - 1) * 100; return `<tr${b === 0 ? ' style="font-weight:700"' : ""}><td class=r>${b > 0 ? "+" : ""}${b}bp</td><td class=r>${f2(x.yin + b / 100, 2)}%</td><td class=r>${pct(-r.Dpf * b / 100 + 0, 1)}</td><td class=r>${pct(brl, 1)}</td>${fxs.map(f => `<td class=r>${pct(k(f), 1)}</td>`).join("")}<td class=r>${pct(real(k(0), kr), 1)}</td></tr>`; }).join("")}</tbody></table></div>
      <div class=note>헤알 손익 = 진입 YTM − 듀레이션 × 진입 후 금리변동 (12개월 후 매도). 굵은 줄 = 진입 후 변동 없음. 실질(원)은 한국 물가 ${f2(kr, 1)}% 차감.</div>`; })()}
    ${usdSection(r, m)}
    <div class=note>계산: 진입 PF32 YTM = 현재 ${f2(m.ytm)}% + 직후 금리변동 → 손익 = 진입 YTM − 듀레이션 ${f2(r.Dpf, 1)} × 진입 후 추가 금리변동 · Selic = 평균 Selic + 스프레드 ${f2(r.selSp, 4)}%p(${r.srcSl}) · IPCA+ = (1+진입 실질금리[현재 ${f2(r.ipReal)}%(${r.srcIp}) + 직후 변동])×(1+IPCA) − 듀레이션 ${f2(r.Dip, 1)} × 진입 후 실질 추가 변동 · 원화 = (1+BRL 손익)×(1+진입 후 환율변동) − 1. <b>12개월 후 매도 기준</b>이라 PF32를 만기까지 보유하면 가격 변동은 확정 손실이 아닙니다. 기다리는 동안의 이자(약 1주 ≈ 0.25%p), 매수 시점 호가 차이, 반응이 진입 전에 더 커지는 경우는 반영하지 않았습니다. 투자 권유가 아닌 가정 기반 비교입니다.</div>
    <p><button class=noprint onclick="showPolRef=!showPolRef;render(true)">📊 과거 선거·재정 충격 때의 실제 반응 ${showPolRef ? "닫기 ▲" : "보기 ▼"}</button> <button class=noprint onclick="if(confirm('가정값을 기본값으로 되돌립니다.'))polReset()">기본값으로</button></p>
    ${showPolRef ? `<div class=tbl><table class=mono><thead><tr><th>사건 (같은 고정금리 채권)</th><th class=r>금리</th><th class=r>채권 가격</th><th class=r>BRL/KRW</th></tr></thead><tbody>
      <tr><td>2018 우파 부상 (1차→결선 직전)</td><td class=r>-95bp</td><td class=r>+4.2%</td><td class=r>+5.0%</td></tr>
      <tr><td>2018 우파 승리 (결선→+20영업일)</td><td class=r>-50bp</td><td class=r>+2.6%</td><td class=r>-5.0%</td></tr>
      <tr><td>2022 룰라 승리 (결선→+20영업일)</td><td class=r>+158bp</td><td class=r>-7.4%</td><td class=r>-6.9%</td></tr>
      <tr><td>2022 룰라 승리 (+60영업일, 재정 우려)</td><td class=r>+109bp</td><td class=r>-2.8%</td><td class=r>-8.5%</td></tr>
      <tr><td>2024-11 재정 패키지 실망 (→12/20)</td><td class=r>+192bp</td><td class=r>-5.0%</td><td class=r>-0.3%*</td></tr>
      <tr><td><b>2026 1차 직후 (10/2→10/15)</b></td><td class=r>-128bp</td><td class=r>+6.5%</td><td class=r>+3.1%</td></tr></tbody></table></div>
      <div class=note>Tesouro CSV·Frankfurter(ECB) 이력으로 계산 · *2024년 말은 원화 약세가 겹쳐 BRL/KRW가 덜 움직임 · 이번 1차 후 이미 금리가 크게 내려 우파 승리가 상당 부분 가격에 반영됨(비대칭).</div>` : ""}
  </div></section>`;
}
// 만기까지 연평균 IPCA 기대: BCB Focus 연도별 중앙값을 기간(연 단위) 가중 기하평균. 자료가 끝난 연도는 마지막 값 유지
function inflBR(now = new Date(), byOverride) {
  const man = INF().br_manual;
  if (man > 0) return {v: man, src: "수동 입력"};
  const by = byOverride || (D.infl && D.infl.br && D.infl.br.by_year);
  if (!by) return {v: 4.0, src: "자료 없음 → 기본 4.0%"};
  const [d, mo, y] = C.tracked.venc.split("/").map(Number), end = new Date(y, mo - 1, d);
  const yrs = Object.keys(by).map(Number).sort((a, b) => a - b), lastV = by[yrs.at(-1)];
  let g = 1, T = 0;
  for (let yy = now.getFullYear(); yy <= end.getFullYear(); yy++) {
    const a = Math.max(now, new Date(yy, 0, 1)), b = Math.min(end, new Date(yy + 1, 0, 1)), f = (b - a) / (365.25 * 864e5);
    if (f <= 0) continue;
    g *= Math.pow(1 + (by[yy] ?? lastV) / 100, f); T += f;
  }
  return {v: T > 0 ? (Math.pow(g, 1 / T) - 1) * 100 : lastV, src: `BCB Focus(${D.infl && D.infl.br ? D.infl.br.asof : "-"}) · 만기 ${C.tracked.venc}까지 연평균`};
}
// 과거 날짜 d 시점의 만기까지 연평균 IPCA 기대 (그날 이전 가장 최근 Focus 스냅샷 사용, 없으면 가장 오래된 것)
function inflAt(d) {
  const H = D.infl && D.infl.br && D.infl.br.history; if (!H) return inflBR().v;
  const ks = Object.keys(H).sort(); let k = ks[0];
  for (const x of ks) { if (x <= d) k = x; else break; }
  const [yy, mm, dd] = d.split("-").map(Number);
  return inflBR(new Date(yy, mm - 1, dd), H[k]).v;
}
// 환율 시나리오 x(BRL/KRW)에서의 총수익: 원화 기준, 달러 기준(USD/KRW 는 가정값 또는 현재 유지)
function views(m, x) {
  const inf = INF(), usd = D.fx_usd && D.fx_usd.latest ? D.fx_usd.latest[1] : null;
  const usdkrwNow = usd ? m.fx / usd : null, usdkrw = inf.usdkrw_assume > 0 ? inf.usdkrw_assume : usdkrwNow;
  const krw = total(m.ytm, m.fx, x);
  const usdT = usd ? ((1 + m.ytm / 100) * (x / m.fx) * (usdkrwNow / usdkrw) - 1) * 100 : null;
  return {krw, krwReal: real(krw, inf.kr), usd: usdT, usdReal: usdT == null ? null : real(usdT, inf.us), usdkrwNow, usdkrw};
}
// 실질수익 0%가 되는 BRL/KRW (원화·달러 기준) — 이 아래로 환율이 내리면 물가를 감안한 구매력이 줄어듦
function breakeven(m) {
  const inf = INF(), v = views(m, m.fx);
  return {krw: m.fx * (1 + inf.kr / 100) / (1 + m.ytm / 100),
          usd: v.usdkrwNow ? m.fx * (1 + inf.us / 100) / (1 + m.ytm / 100) * v.usdkrw / v.usdkrwNow : null};
}
// 직전 영업일(국채 CSV 기준) 명목 YTM 대비 변동. 물가 기대는 동일하다고 보고 실질 변동을 계산
const dayChg = (m, nowNom, piPct, prevNom) => {
  if (prevNom == null || !m.before) return null;
  const d = (real(nowNom, piPct) - real(prevNom, piPct)) * 100;   // bp
  return {bp: d, txt: (d >= 0 ? "▲ +" : "▼ ") + f2(d, 1) + "bp", date: brDate(m.before[0])};
};
function realPanel(m) {
  const inf = INF(), br = inflBR(), v = views(m, m.fx), be = breakeven(m);
  const pv = m.before ? m.before[1] : null;   // 직전 영업일 명목 YTM (환율 불변 가정이므로 원·달러 행도 같은 YTM 기준)
  const row = (name, nom, pi, note) => { const c = dayChg(m, nom, pi, pv); return `<tr><td>${name}</td><td class=r>${pct(nom, 2)}</td><td class=r>${f2(pi)}%</td><td class=r style="font-weight:700">${pct(real(nom, pi), 2)}</td><td class=r>${c ? c.txt : "—"}</td><td><small>${note}</small></td></tr>`; };
  return `<div class=tbl><table class=mono><thead><tr><th>기준 통화</th><th class=r>명목 YTM</th><th class=r>물가(연)</th><th class=r>실질 수익</th><th class=r>전일 대비</th><th>물가 가정</th></tr></thead><tbody>
    ${row("BRL 헤알", m.ytm, br.v, "IPCA 기대 · " + br.src)}
    ${row("KRW 원 (환율 불변)", v.krw, inf.kr, "한국 물가 " + f2(inf.kr) + "% (설정값)")}
    ${v.usd == null ? "" : row("USD 달러 (환율 불변)", v.usd, inf.us, "미국 물가 " + f2(inf.us) + "% (설정값)")}</tbody></table></div>
    <div class=note>실질 = (1+명목) ÷ (1+물가) − 1 · 명목 YTM ${f2(m.ytm)}%는 1년 기준 연율 · 전일 대비는 ${m.before ? brDate(m.before[0]) : "직전"} 대비(물가 기대는 동일 가정). <b>원화 기준 실질 0% 손익분기 BRL/KRW ≈ ${f2(be.krw)}</b> (현재 ${f2(m.fx)}, ${pct((be.krw / m.fx - 1) * 100, 1)})${be.usd ? ` · 달러 기준 ≈ ${f2(be.usd)}` : ""} — 이보다 환율이 내리면 물가를 뺀 구매력이 줄어듭니다.
    ${v.usdkrwNow ? ` 달러 기준은 USD/KRW ${f2(v.usdkrw)}${INF().usdkrw_assume > 0 ? "(가정)" : "(현재 " + f2(v.usdkrwNow) + " 유지)"}로 계산.` : ""} 한국·미국 물가는 직접 입력하는 가정값입니다(설정 탭).</div>`;
}

// ---------- 공용 컴포넌트 ----------
function spark(vals, w = 560, h = 90, mark) {
  if (vals.length < 2) return "<div class=note>데이터 부족</div>";
  const mn = Math.min(...vals), mx = Math.max(...vals), sx = i => 4 + i * (w - 8) / (vals.length - 1), sy = v => h - 14 - (v - mn) / (mx - mn || 1) * (h - 28);
  const pts = vals.map((v, i) => sx(i).toFixed(1) + "," + sy(v).toFixed(1)).join(" ");
  const ml = mark != null ? `<line x1="0" x2="${w}" y1="${sy(mark)}" y2="${sy(mark)}" stroke="currentColor" stroke-dasharray="3 3" opacity=".6"/><text x="${w - 4}" y="${sy(mark) - 3}" text-anchor="end">${f2(mark)}</text>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="color:var(--ink)"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5"/>${ml}<text x="4" y="10">${f2(mx)}</text><text x="4" y="${h - 2}">${f2(mn)}</text></svg>`;
}

// 가격(PU, 좌축)과 수익률(명목·실질, 우축)을 한 차트에 겹쳐 그림
let chartSeq = 0; const CH = {};
function dualChart(pu, nom, rl, w = 560, h = 190, mark, dates, full) {
  const n = pu.length; if (n < 2) return "<div class=note>데이터 부족</div>";
  const M = 76, sx = i => M + i * (w - 2 * M) / (n - 1);   // 좌우 여백에 시작·끝 값 라벨을 넣는다
  const pmn = Math.min(...pu), pmx = Math.max(...pu), ymn = Math.min(...rl), ymx = Math.max(...nom);
  const sp = v => h - 16 - (v - pmn) / (pmx - pmn || 1) * (h - 30), sy = v => h - 16 - (v - ymn) / (ymx - ymn || 1) * (h - 30);
  const line = (arr, f, extra) => `<polyline points="${arr.map((v, i) => sx(i).toFixed(1) + "," + f(v).toFixed(1)).join(" ")}" fill="none" ${extra}/>`;
  const mk = mark != null && mark >= pmn && mark <= pmx ? `<line x1="${M}" x2="${w - M}" y1="${sp(mark)}" y2="${sp(mark)}" stroke="currentColor" stroke-dasharray="1 4" opacity=".7"/><text x="${M + 2}" y="${sp(mark) - 3}" font-size="9">지정가 ${f2(mark)}</text>` : "";
  // 시점 값 라벨: 각 곡선의 첫 점(좌)·마지막 점(우). 서로 겹치면 위아래로 밀어낸다
  const pack = ls => { ls.sort((a, b) => a.y - b.y); for (let i = 1; i < ls.length; i++) if (ls[i].y - ls[i - 1].y < 11) ls[i].y = ls[i - 1].y + 11; return ls; };
  const L = pack([{y: sp(pu[0]), t: "PU " + f2(pu[0])}, {y: sy(nom[0]), t: "명목 " + f2(nom[0]) + "%"}, {y: sy(rl[0]), t: "실질 " + f2(rl[0]) + "%"}]);
  const R = pack([{y: sp(pu[n - 1]), t: "PU " + f2(pu[n - 1])}, {y: sy(nom[n - 1]), t: "명목 " + f2(nom[n - 1]) + "%"}, {y: sy(rl[n - 1]), t: "실질 " + f2(rl[n - 1]) + "%"}]);
  const lab = (arr, x, anc) => arr.map(o => `<text x="${x}" y="${(o.y + 3).toFixed(1)}" text-anchor="${anc}" font-weight="700" font-size="10">${o.t}</text>`).join("");
  const dt = dates && dates.length === n ? `<text x="${M}" y="${h + 11}" text-anchor="middle">${dates[0]}</text><text x="${w - M}" y="${h + 11}" text-anchor="middle">${dates[n - 1]}</text>` : "";
  const id = "ch" + (++chartSeq);
  CH[id] = {n, M, w, h, pmn, pmx, ymn, ymx, pu, nom, rl, full: full || dates || []};
  return `<svg id="${id}" viewBox="0 0 ${w} ${h + (dt ? 14 : 0)}" width="100%" style="color:var(--ink);font-family:inherit;font-size:11px;touch-action:pan-y">
    ${line(pu, sp, 'stroke="currentColor" stroke-width="1.6"')}
    ${line(nom, sy, 'stroke="currentColor" stroke-width="1" opacity=".38"')}
    ${line(rl, sy, 'stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 3"')}
    <g font-size="9" opacity=".55">${[[L, 2, "start", 9, f2(pmx)], [L, 2, "start", h - 2, f2(pmn)], [R, w - 2, "end", 9, f2(ymx) + "%"], [R, w - 2, "end", h - 2, f2(ymn) + "%"]]
      .filter(([ls, , , cy]) => !ls.some(o => Math.abs(o.y + 3 - cy) < 11)).map(([, x, anc, cy, t]) => `<text x="${x}" y="${cy}" text-anchor="${anc}">${t}</text>`).join("")}</g>
    ${mk}${lab(L, M - 6, "end")}${lab(R, w - M + 6, "start")}${dt}
    <circle cx="${sx(0)}" cy="${sp(pu[0])}" r="2.2" fill="currentColor"/><circle cx="${sx(n - 1)}" cy="${sp(pu[n - 1])}" r="2.6" fill="currentColor"/><circle cx="${sx(n - 1)}" cy="${sy(rl[n - 1])}" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <g id="${id}c" visibility="hidden" pointer-events="none">
      <line id="${id}l" y1="2" y2="${h - 12}" stroke="currentColor" stroke-width="1" opacity=".55"/>
      <circle id="${id}p" r="3.4" fill="currentColor"/><circle id="${id}n" r="3" fill="var(--paper)" stroke="currentColor" opacity=".7"/><circle id="${id}r" r="3.4" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/>
      <g id="${id}t"><rect id="${id}b" rx="2" fill="var(--paper)" stroke="currentColor" stroke-width="1"/>
        <text id="${id}t0" font-weight="700" font-size="11"></text><text id="${id}t1" font-size="10.5"></text><text id="${id}t2" font-size="10.5"></text><text id="${id}t3" font-size="10.5" font-weight="700"></text></g></g>
    <rect x="0" y="0" width="${w}" height="${h + (dt ? 14 : 0)}" fill="transparent" onpointermove="chartHover(event,'${id}')" onpointerdown="chartHover(event,'${id}')" onpointerleave="chartLeave('${id}')" onpointercancel="chartLeave('${id}')" style="cursor:crosshair"/>
  </svg>`;
}

// 마우스·터치 위치의 날짜와 세 곡선의 값을 표시
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function chartHover(ev, id) {
  const c = CH[id], svg = document.getElementById(id); if (!c || !svg) return;
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const step = (c.w - 2 * c.M) / (c.n - 1), i = Math.max(0, Math.min(c.n - 1, Math.round((p.x - c.M) / step)));
  const x = c.M + i * step, sp = v => c.h - 16 - (v - c.pmn) / (c.pmx - c.pmn || 1) * (c.h - 30), sy = v => c.h - 16 - (v - c.ymn) / (c.ymx - c.ymn || 1) * (c.h - 30);
  const set = (k, a) => { const e = document.getElementById(id + k); Object.entries(a).forEach(([n, v]) => e.setAttribute(n, v)); return e; };
  set("l", {x1: x, x2: x}); set("p", {cx: x, cy: sp(c.pu[i])}); set("n", {cx: x, cy: sy(c.nom[i])}); set("r", {cx: x, cy: sy(c.rl[i])});
  const iso = (c.full[i] || "").match(/\d{2}\/\d{2}\/\d{4}/), d = iso ? iso[0].split("/").reverse().join("-") : null;
  const wd = d ? " (" + WD[new Date(d + "T00:00:00").getDay()] + ")" : "";
  const dRl = i > 0 ? (c.rl[i] - c.rl[i - 1]) * 100 : null;
  const lines = [(c.full[i] || "") + wd, "PU " + f2(c.pu[i]), "명목 " + f2(c.nom[i]) + "%", "실질 " + f2(c.rl[i]) + "%" + (dRl == null ? "" : "  " + (dRl >= 0 ? "▲+" : "▼") + f2(dRl, 1) + "bp")];
  const tw = Math.max(...lines.map(s => s.length)) * 6.4 + 14, th = 4 * 14 + 8, tx = x + 10 + tw > c.w ? x - 10 - tw : x + 10, ty = 6;
  set("b", {x: tx, y: ty, width: tw, height: th});
  lines.forEach((s, k) => { const e = set("t" + k, {x: tx + 7, y: ty + 16 + k * 14}); e.textContent = s; });
  document.getElementById(id + "c").setAttribute("visibility", "visible");
}

function realCmpSection(m) {

  const sc = C.scenarios.map((s, i) => `<tr><td><input data-k="scenarios.${i}.name" value="${s.name}"></td><td><input type=number data-k="scenarios.${i}.prob" value="${s.prob}"></td><td><input type=number step=any data-k="scenarios.${i}.fx" value="${s.fx}"></td></tr>`).join("");
  return `<section><h2>설정 (이 기기 브라우저에 저장)</h2><div class=body>
    <div class=tbl><table><thead><tr><th>단계</th><th>비중%</th><th>지정가/체결가</th><th>날짜</th><th>체결</th></tr></thead><tbody>${st}</tbody></table></div>
    <div class=kv style="margin:10px 0"><label>STOP 가격</label><input type=number step=any data-k="stop_price" value="${C.stop_price}">
      <label>STOP 환율</label><input type=number step=any data-k="stop_fx" value="${C.stop_fx}">
      <label>익절 TARGET</label><input type=number step=any data-k="target_price" value="${C.target_price}">
      <label>BRAZ 2034 YTM %</label><input type=number step=any data-k="braz2034_ytm" value="${C.braz2034_ytm}"></div>
    <div class=kv style="margin:10px 0"><label>한국 물가 %(연)</label><input type=number step=any data-k="infl.kr" value="${INF().kr}">
      <label>미국 물가 %(연)</label><input type=number step=any data-k="infl.us" value="${INF().us}">
      <label>브라질 IPCA %(0=Focus 자동)</label><input type=number step=any data-k="infl.br_manual" value="${INF().br_manual}">
      <label>USD/KRW 가정(0=현재 유지)</label><input type=number step=any data-k="infl.usdkrw_assume" value="${INF().usdkrw_assume}"></div>
    <div class=tbl><table><thead><tr><th>시나리오</th><th>확률%</th><th>BRL/KRW</th></tr></thead><tbody>${sc}</tbody></table></div>
    <p><button class=pri onclick="saveCfg()">저장</button> <span id=saved class=note></span></p>
    <p><button onclick="exportCfg()">📋 설정 복사</button> <button onclick="importCfg()">📥 설정 붙여넣기</button> <span class=note>다른 기기(폰)로 옮길 때: 한 기기에서 복사 → 메신저 '나에게 보내기' 등으로 전달 → 다른 기기에서 붙여넣기. 설정은 서버·GitHub에 올라가지 않고 각 기기 브라우저에만 저장됩니다.</span></p>
    <div class=note>데이터: 환율=Frankfurter(ECB) · 국채=Tesouro Transparente(영업일 기준, 1~2일 지연) · 라이브=${C.downloads_glob} 중 가장 최근 파일. 국채·환율 데이터는 서버가 매일 자동 갱신합니다. 라이브 가격은 상단 📂 CSV로 rendimento-investir 파일을 올리면 반영됩니다.</div>
  </div></section>`;
};

const CFG_KEYS = ["stages", "stop_price", "stop_fx", "target_price", "braz2034_ytm", "scenarios", "extra_fx_rows", "fx_range", "infl", "pol", "usd_inc", "rc_cases"];
async function exportCfg() {
  const o = {}; CFG_KEYS.forEach(k => { if (C[k] !== undefined) o[k] = C[k]; });
  const t = JSON.stringify(o);
  try { await navigator.clipboard.writeText(t); $("#saved").textContent = "복사됨 ✓ (개인 설정 포함 — 전달 후 메신저에서 삭제하세요)"; }
  catch (e) { prompt("아래 내용을 복사하세요", t); }
}
function importCfg() {
  const t = prompt("복사한 설정(JSON)을 붙여넣으세요"); if (!t) return;
  let o; try { o = JSON.parse(t); } catch (e) { alert("형식이 올바르지 않습니다"); return; }
  if (!o || typeof o !== "object" || Array.isArray(o)) { alert("형식이 올바르지 않습니다"); return; }
  CFG_KEYS.forEach(k => { if (o[k] !== undefined) C[k] = o[k]; });
  try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {}
  render(); setTimeout(() => { const s = $("#saved"); if (s) s.textContent = "가져옴 ✓"; }, 50);
}

async function saveCfg() {
  if (!C.infl) C.infl = {};
  document.querySelectorAll("[data-k]").forEach(el => {
    const path = el.dataset.k.split("."); let o = C;
    path.slice(0, -1).forEach(p => o = o[p]);
    const k = path.at(-1), v = el.type === "checkbox" ? el.checked : el.type === "number" ? parseFloat(el.value) : el.value;
    o[k] = v;
  });
  try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {}
  if (LOCAL) await fetch("/api/config", {method: "POST", body: JSON.stringify(C)}).catch(() => {});
  $("#saved").textContent = "저장됨 ✓"; setTimeout(() => render(), 600);
}

// 자동 갱신이 멈췄거나 실패했는지 화면에서 바로 알 수 있게 경고 (ECB 휴일·주말 4일까지는 정상으로 본다)
function staleWarn() {
  const days = s => Math.floor((Date.now() - new Date(s).getTime()) / 864e5);
  let w = "";
  if (D.status && D.status.fx !== "ok") w += " · ⚠ 환율 갱신 실패(이전 값 표시)";
  const fxd = D.fx && D.fx.latest && D.fx.latest[0];
  if (fxd && days(fxd) > 4) w += ` · ⚠ 환율 ${days(fxd)}일 지연`;
  if (days(D.generated) >= 3) w += ` · ⚠ 자동 갱신 ${days(D.generated)}일째 멈춤`;
  return w;
}

function render(keepFocus) {
  $("#nav").innerHTML = TABS.map(([k, n]) => `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';localStorage.setItem('tab',tab);render()">${n}</button>`).join("");
  const on = $("#nav .on"); if (on) on.scrollIntoView({inline: "center", block: "nearest"});
  const m = model();
  $("#meta").textContent = `자동갱신 ${kst(D.generated)}${D.live_info ? " · CSV파일 " + D.live_info.mtime.slice(5).replace("T", " ") : ""} · ${C.tracked.label} ${f2(m.price)} / ${f2(m.ytm)}% · BRL/KRW ${f2(m.fx)}` +
    (D.status.treasury_csv !== "ok" ? " · ⚠ 국채 CSV 부분" : "") + staleWarn();
  $("#app").innerHTML = V[tab](m);
  if (keepFocus) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

// 좌우 스와이프로 탭 이동 (가로 스크롤 가능한 표·입력칸 위에서는 무시)
(() => {
  let x0, y0, t0, skip;
  const go = d => { const i = TABS.findIndex(t => t[0] === tab), n = TABS[i + d]; if (!n) return; tab = n[0]; try { localStorage.setItem("tab", tab); } catch (e) {} render(); scrollTo(0, 0); };
  document.addEventListener("touchstart", e => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    const el = e.target.closest ? e.target.closest(".tbl,input,nav") : null;
    skip = e.touches.length > 1 || (el && (el.matches("input,nav") || el.scrollWidth > el.clientWidth + 1));
  }, {passive: true});
  document.addEventListener("touchend", e => {
    if (skip || x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - t0 < 600) go(dx < 0 ? 1 : -1);
  }, {passive: true});
})();
$("#btnCsv").onclick = () => $("#csvFile").click();
$("#csvFile").onchange = e => e.target.files[0] && uploadCsv(e.target.files[0]);
if (!LOCAL) $("#btnUpdate").textContent = "⟳ 새로고침";
$("#btnUpdate").onclick = async () => {
  if (!LOCAL) { await load(); return; }   // 정적 배포: 서버가 매일 data.json 을 갱신, 여기선 다시 읽기만
  const b = $("#btnUpdate"); b.disabled = true; b.textContent = "업데이트 중… (국채 CSV는 수 분 소요)";
  $("#log").classList.remove("hidden");
  await fetch("/api/update", {method: "POST"});
  const t = setInterval(async () => {
    const s = await fetch("/api/status").then(r => r.json());
    $("#log").textContent = s.log;
    if (!s.running) { clearInterval(t); b.disabled = false; b.textContent = "⟳ 지금 업데이트"; await load(); }
  }, 2000);
};

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
load().catch(e => { $("#app").innerHTML = `<section><div class=body>data/data.json 이 없습니다. <b>python3 update.py</b> 를 먼저 실행하거나 '지금 업데이트'를 누르세요.<br><small>${e}</small></div></section>`; });
