<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PF32 Dashboard</title>
<style>
:root{--bg:#e8e8e8;--paper:#fff;--ink:#000;--soft:#f3f3f1;--line:rgba(0,0,0,.18);--up:#000;--ok:#1a7f37;--okbg:rgba(34,160,70,.16);--bad:#c0392b;--badbg:rgba(192,57,43,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--paper:#1b1b1b;--ink:#f2f2f2;--soft:#262626;--line:rgba(255,255,255,.22);--ok:#4cc26a;--okbg:rgba(76,194,106,.2);--bad:#ff6b5e;--badbg:rgba(255,107,94,.14)}}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13px}
.mono,.mono *{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rt{display:inline-block;font-size:10px;line-height:14px;font-weight:700;padding:0 4px;margin-left:3px;border:1px solid var(--ink);white-space:nowrap;vertical-align:middle;letter-spacing:0}
.rt-n{opacity:.65}
.rt-r{border-style:dashed}
.rt-kn{border-width:2px}
.rt-kr{background:var(--ink);color:var(--paper)}
.rk{display:inline-block;font-size:10px;line-height:14px;font-weight:700;padding:0 5px;margin-right:2px;vertical-align:middle;color:#fff}
.rk-w{background:var(--bad)}
.rk-a{background:#808080}
.rk-b{background:var(--ok)}
@media (prefers-color-scheme:dark){.rk-w,.rk-b{color:#000}}
.rtleg{font-size:11px;line-height:20px;margin:0 0 8px;padding:4px 8px;border:1px solid var(--line);background:var(--paper)}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;gap:8px;align-items:center;padding:6px 12px;flex-wrap:wrap}
header .logo{background:var(--ink);color:var(--paper);font-weight:900;padding:2px 8px}
header .meta{font-size:11px;opacity:.7;flex:1;min-width:160px}
button{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:5px 10px;font-size:12px;cursor:pointer;font-weight:700}
button.pri{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.5;cursor:wait}
nav{display:flex;gap:0;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--ink)}
nav button{border:0;border-right:1px solid var(--line);padding:8px 14px;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--paper)}
main{max-width:1000px;margin:12px auto;padding:0 12px 40px}
section{background:var(--paper);border:1px solid var(--ink);margin-bottom:12px}
section>h2{margin:0;padding:5px 10px;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:.06em}
.body{padding:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-size:11px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{border:1px solid var(--ink);padding:8px 10px}
.card small{display:block;opacity:.65;font-size:10px;letter-spacing:.08em}
.card b{font-size:20px}
.tag{display:inline-block;border:1px solid var(--ink);padding:0 5px;font-size:10px;font-weight:700}
.tag.inv{background:var(--ink);color:var(--paper)}
.bar{display:flex;height:40px;border:1px solid var(--ink)}
.bar>div{display:flex;flex-direction:column;justify-content:center;padding:0 8px;border-right:1px solid var(--ink);font-size:11px;overflow:hidden}
.bar>.f{background:var(--ink);color:var(--paper)}
.warn{border:1px dashed var(--ink);padding:6px 8px;margin-top:8px;font-size:12px}
.note{font-size:11px;opacity:.7;margin-top:6px;line-height:1.5}
.hero{background:var(--ink);color:var(--paper);padding:12px 14px;display:flex;gap:6px 26px;align-items:flex-end;flex-wrap:wrap}
.hero small{display:block;opacity:.7;font-size:10px;letter-spacing:.08em;margin-bottom:2px}
.hero .big{font-size:36px;font-weight:900;line-height:1}
.hero .mid{font-size:22px;font-weight:800;line-height:1.1}
.pgrid{display:grid;gap:12px;grid-template-columns:1fr;margin:10px 0}
.pb2{display:grid;grid-template-columns:minmax(230px,290px) 1fr;gap:14px;align-items:start}
@media (max-width:720px){.pb2{grid-template-columns:1fr}}
.pleg{font-size:10.5px;opacity:.75;margin-top:2px;line-height:1.5}
.panel{border:2px solid var(--ink);background:var(--paper)}
.panel .ph{background:var(--ink);color:var(--paper);padding:5px 10px;font-weight:800;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.panel .ph small{opacity:.75;font-weight:400}
.panel .pb{padding:10px}
.panel .big{font-size:32px;font-weight:900;line-height:1.05}
.panel .sub{font-size:11px;opacity:.7;margin:2px 0 8px}
.kvr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-size:12px}
.kvr span{opacity:.7;white-space:nowrap}.kvr b{font-size:13px;text-align:right}.kvr small{display:block;opacity:.65;font-weight:400;font-size:10px}
.panel.best{border-width:3px}
.callout{border:2px solid var(--ink);padding:9px 12px;margin:10px 0;font-size:14px;line-height:1.55}
.callout.go{border-color:var(--ok);background:var(--okbg)}
.callout.bad{border-color:var(--bad);background:var(--badbg)}
.callout.sum{background:var(--soft)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.subnav button{font-size:11px;padding:3px 9px}
details.fold{border:1px solid var(--ink);margin:10px 0;padding:0}
details.fold>summary{cursor:pointer;padding:7px 10px;font-weight:700;font-size:12px;background:var(--soft);list-style:none}
details.fold>summary::before{content:"▸ "}details.fold[open]>summary::before{content:"▾ "}
details.fold>div{padding:8px 10px}
tr.hl td{background:var(--soft)}
tr.hl-bad td{background:var(--badbg)}
@media (max-width:560px){.tbl td:first-child,.tbl th:first-child{min-width:74px}.hero .big{font-size:32px}}
.rng{position:relative;height:18px;border:1px solid var(--ink);margin:14px 0 4px}
.rng i{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink)}
.rng em{position:absolute;top:18px;font-size:10px;font-style:normal;transform:translateX(-50%);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.kv label{font-size:11px;opacity:.7}
input{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:4px 6px;font-size:13px;width:100%}
input[type=checkbox]{width:auto}
#log{white-space:pre-wrap;font-size:10px;opacity:.7;margin-top:6px;max-height:120px;overflow:auto}
svg text{fill:var(--ink);font-size:10px}
.hidden{display:none}
@page{size:A4;margin:10mm}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}section{break-inside:auto}.view{display:block!important}
  main,#app,section,.body{max-width:100%!important;overflow:visible!important}
  .tbl{overflow:visible!important}
  table{width:100%!important;table-layout:auto;font-size:9px!important}
  th,td{white-space:normal!important;min-width:0!important;padding:3px 3px!important;word-break:keep-all}
  td[style*="min-width"]{min-width:0!important}
  input{width:46px!important;font-size:9px!important;padding:1px 2px!important}
  td.r{white-space:nowrap!important}
  tr{break-inside:avoid}}
/* 용어정리 탭(glossary.html 조각) */
a.gll{font-size:12px;color:#1f4e79;white-space:nowrap}@media (prefers-color-scheme:dark){a.gll{color:#8db8e3}}
.gl [hidden]{display:none!important}
.glsug{border:1px solid var(--ink);max-height:46vh;overflow-y:auto;margin:2px 0 10px;background:var(--paper)}.glsug .glc{font-size:12px;padding:5px 10px;background:var(--soft)}
.glsug button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;cursor:pointer}.glsug button:hover{background:var(--soft)}.glsug button small{color:#777;margin-left:6px}.glsug button span{display:block;font-size:12.5px;color:#777}.glsug mark{background:#ffe38a;color:#000}
@keyframes glf{from{background:#ffe38a}to{background:transparent}}.gl .glflash{animation:glf 1.8s}
.gl{--muted:#5a6573;--rule:var(--line);--accent:#1f4e79;--accent-soft:#e7eef6;--calc:var(--soft);--warn:#8a4b08;--warn-soft:#fbf1e3;line-height:1.7;word-break:keep-all}
@media (prefers-color-scheme:dark){.gl{--muted:#9aa5b3;--accent:#8db8e3;--accent-soft:#1c2a3a;--warn:#e3a35a;--warn-soft:#2a2116}}
.gl .gl-toc ol{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}.gl .gl-toc a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--line)}.gl .gl-toc .sub{display:none}
.gl section.part{margin-bottom:34px}.gl section.part{padding:0;border:0;background:none}.gl section.part>h2{background:none;color:var(--ink);padding:0 0 6px;font-size:20px;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:0 0 8px}.gl p.lead{color:var(--muted);margin:6px 0 14px}
.gl article.term{padding:16px 0;border-bottom:1px solid var(--line)}.gl article.term h3{font-size:16px;margin:0;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}.gl article.term h3 small{font-size:12.5px;font-weight:500;color:var(--muted)}
.gl .def{margin:6px 0 10px}.gl .ex{background:var(--calc);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;margin:10px 0}.gl .ex h4{margin:0 0 4px;font-size:13px;color:var(--accent)}.gl .ex p{margin:6px 0}
.gl .calc{font-size:13.5px;line-height:1.85;overflow-x:auto}.gl .calc div{white-space:nowrap}.gl .calc .r{font-weight:700}
.gl .pt{font-size:13.5px;margin:8px 0 0;padding-left:10px;border-left:2px solid var(--line)}.gl .pt b{color:var(--accent)}
.gl .tw{overflow-x:auto;margin:8px 0}.gl table{border-collapse:collapse;font-size:13px;min-width:400px;width:100%}.gl th,.gl td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}.gl th{background:var(--accent-soft)}.gl td.n,.gl th.n{text-align:right}
.gl .gl-foot{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<header>
  <span class="logo mono">PF32</span>
  <span class="meta mono" id="meta">로딩 중…</span>
  <button id="btnCsv" title="rendimento-investir CSV 올리기">📂 CSV</button><input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <button class="pri" id="btnUpdate">⟳ 지금 업데이트</button>
  <button onclick="print()">🖨 인쇄(A4)</button>
</header>
<nav id="nav"></nav>
<main>
  <div id="log" class="mono hidden"></div>
  <div id="app"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const f2 = (n, d = 2) => n == null || isNaN(n) ? "—" : n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
// 수익률 표기: 명목(현지통화·물가·환율 미보정) / 실질(현지통화·물가 보정) / 원화 명목(환율 반영·물가 미보정) / 원화 실질(환율 반영+한국 물가 보정)
const rtTag = (c, t, tip) => `<span class="rt rt-${c}" title="${tip}">${t}</span>`;
const RT = {n: rtTag("n", "명목", "명목 수익률 — 현지통화 기준, 물가·환율 보정 없음"), r: rtTag("r", "실질", "실질 수익률 — 현지통화 기준, 물가만 보정(환율 미반영)"),
  kn: rtTag("kn", "원화 명목", "원화 명목 — 환율 반영, 물가 보정 없음"), kr: rtTag("kr", "원화 실질", "원화 실질 — 환율 반영 후 한국 물가 보정")};
const RK = {w: '<span class="rk rk-w">최악</span>', a: '<span class="rk rk-a">평균</span>', b: '<span class="rk rk-b">최선</span>'};   // 환율 가정 4종 최악(빨강)·평균(회색)·최선(초록)
const RKP = (k, p) => { const key = {w: "lo", a: "av", b: "hi"}[k], lab = {w: "최악", a: "평균", b: "최선"}[k]; if (!p) return RK[k];
  return `<span class="rk rk-${k}" title="과거 1년 환율 변동(전체 약 ${f2(p[0].n / 52, 0)}년 ${f2(p[0][key], 0)}% · 최근 5년 ${f2(p[1][key], 0)}%) 중 원화 실질이 이 값 ${k === "w" ? "이하" : "이상"}으로 나온 비율">${lab} ${f2(p[0][key], 0)}%</span>`; };
const rtLegend = () => `<div class="rtleg">수익률 표기 — ${RT.n} 현지통화·물가·환율 미보정 · ${RT.r} 현지통화·물가 보정(환율 미반영) · ${RT.kn} 환율 반영·물가 미보정 · ${RT.kr} 환율 반영 + 한국 물가 보정</div>`;
const rtBond = s => /IPCA|Renda\+|Educa\+/i.test(s) ? RT.r : RT.n;   // IPCA+ 계열의 '수익률'은 물가에 더해지는 실질금리
const pct = (n, d = 2) => n == null || isNaN(n) ? "—" : (n >= 0 ? "+" : "") + f2(n, d) + "%";
const brDate = iso => iso ? iso.slice(8) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "—";
let D, C, tab = localStorage.getItem("tab") || "overview";

const TABS = [["overview","01 최신변동"],["stages","02 분할매수"],["fx","03 환율"],["scen","04 시나리오"],["port","05 헤알·달러·5:5 비교"],["bonds","06 국채 전체"],["settings","설정"],["help","도움말"],["gloss","용어정리"]];

const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);

// ---------- 접속 코드 (공개 Pages 전용 · 이 Mac 의 로컬 서버(127.0.0.1)는 면제) ----------
// 정적 사이트라 브라우저 안에서만 확인하는 '가벼운 잠금'이다(서버 인증 아님). 코드는 저장하지 않고 PBKDF2 해시만 둔다. 교체: python3 set_access_code.py
const ACCESS = {salt: "5a5c65900a7aaf1e22298544b441d574", iter: 310000, hash: "b7533d185fdc5584c8b274d1abc5839697d916d22f595b79d629f4cac4a2ddd8"};
const normCode = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
async function accessHash(code) {
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(normCode(code)), "PBKDF2", false, ["deriveBits"]);
  const salt = Uint8Array.from(ACCESS.salt.match(/../g).map(h => parseInt(h, 16)));
  const b = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt, iterations: ACCESS.iter}, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function authOk() {
  if (LOCAL) return true;
  try { const t = JSON.parse(localStorage.getItem("pf32auth") || sessionStorage.getItem("pf32auth") || "null"); return !!t && t.h === ACCESS.hash && t.exp > Date.now(); } catch (e) { return false; }
}
function lockOut() { try { localStorage.removeItem("pf32auth"); sessionStorage.removeItem("pf32auth"); } catch (e) {} location.reload(); }
function lockScreen() {
  return new Promise(res => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px";
    d.innerHTML = `<form style="background:var(--paper);border:2px solid var(--ink);padding:18px 18px 14px;max-width:340px;width:100%" autocomplete="off">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="logo mono" style="background:var(--ink);color:var(--paper);font-weight:900;padding:2px 8px">PF32</span><b>접속 코드</b></div>
      <input id="acode" type="password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="접속 코드 입력" style="font-size:16px;letter-spacing:.12em;padding:8px">
      <label style="display:flex;gap:6px;align-items:center;margin:8px 0;font-size:12px"><input type="checkbox" id="aremember" checked> 이 기기에서 30일간 기억</label>
      <button class="pri" id="aok" style="width:100%;padding:9px;font-size:14px">확인</button>
      <div id="amsg" class="note" style="min-height:18px;color:var(--bad);opacity:1"></div></form>`;
    document.body.appendChild(d);
    const $a = id => d.querySelector("#" + id), msg = t => { $a("amsg").textContent = t; };
    $a("acode").focus();
    d.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      let f = {n: 0, until: 0}; try { f = JSON.parse(localStorage.getItem("pf32fail") || "") || f; } catch (e2) {}
      if (Date.now() < f.until) { msg(`시도가 너무 많습니다. ${Math.ceil((f.until - Date.now()) / 1000)}초 후 다시 시도하세요.`); return; }
      $a("aok").disabled = true; msg("확인 중…");
      let h = ""; try { h = await accessHash($a("acode").value); } catch (e3) { msg("이 브라우저는 보안 컨텍스트(https)가 필요합니다."); $a("aok").disabled = false; return; }
      $a("aok").disabled = false;
      if (h === ACCESS.hash) {
        const rec = JSON.stringify({h, exp: Date.now() + ($a("aremember").checked ? 30 : 1) * 864e5});
        try { ($a("aremember").checked ? localStorage : sessionStorage).setItem("pf32auth", rec); localStorage.removeItem("pf32fail"); } catch (e4) {}
        d.remove(); res(true);
      } else {
        f.n = (f.n || 0) + 1; if (f.n >= 5) f.until = Date.now() + Math.min(30 * 60, 30 * (f.n - 4)) * 1000;
        try { localStorage.setItem("pf32fail", JSON.stringify(f)); } catch (e5) {}
        msg(f.n >= 5 ? "코드가 올바르지 않습니다. 잠시 후 다시 시도하세요." : `코드가 올바르지 않습니다. (${f.n}/5)`); $a("acode").select();
      }
    };
  });
}
async function jget(u) { try { const r = await fetch(u + "?" + Date.now()); return r.ok ? await r.json() : null; } catch (e) { return null; } }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
async function load() {
  D = await jget("data/data.json"); const cal = await jget("calendar.json");
  if (!D) throw new Error("data/data.json 없음");
  D.cal = cal;
  C = await jget("config.json");
  const loc = await jget("config.local.json"); if (loc) C = {...C, ...loc};   // 개인 설정(로컬 서버 전용, git 제외)
  const ls = lsGet("pf32cfg"); if (ls) C = {...C, ...ls};                    // 이 기기 브라우저 설정
  delete C.stop_price; delete C.stop_fx; delete C.target_price;                                                     // 가격 STOP 폐지(원화 실질 손절 기준으로 대체) — 기기에 남은 옛 값 무시
  const lv = lsGet("pf32live");                                              // 직접 올린 Investir CSV
  if (lv && (!D.live_info || lv.info.mtime >= D.live_info.mtime)) { D.live = lv.rows; D.live_info = lv.info; }
  render();
}
function parseNum(s) { s = s.replace(/R\$|%|\u00a0|\s/g, ""); return s.includes(",") ? parseFloat(s.replace(/\./g, "").replace(",", ".")) : parseFloat(s); }
function parseInvestir(txt) {
  const L = txt.replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean); L.shift();
  return L.map(l => { const c = l.split(";"), name = c[0].trim(), p = name.split(" ");
    const tipo = /^\d+$/.test(p.at(-1)) ? p.slice(0, -1).join(" ") : name, ry = c[1].trim();

      <p class=noprint style="margin:2px 0 6px">${r.rows.map((y, i) => `<button onclick="polSel=${i};render(true)" ${i === polSel ? 'style="font-weight:700;text-decoration:underline"' : ""}>${y.name.split(" ")[0]}</button>`).join(" ")} <small>${x.name} · 진입 YTM ${f2(x.yin, 2)}%</small></p>

// 만기까지 연평균 IPCA 기대: BCB Focus 연도별 중앙값을 기간(연 단위) 가중 기하평균. 자료가 끝난 연도는 마지막 값 유지
function inflBR(now = new Date(), byOverride) {
  const by = byOverride || (D.infl && D.infl.br && D.infl.br.by_year);
  if (!by) return {v: 4.0, src: "자료 없음 → 기본 4.0%"};
  const [d, mo, y] = C.tracked.venc.split("/").map(Number), end = new Date(y, mo - 1, d);
  const yrs = Object.keys(by).map(Number).sort((a, b) => a - b), lastV = by[yrs.at(-1)];
  let g = 1, T = 0;
  for (let yy = now.getFullYear(); yy <= end.getFullYear(); yy++) {
    const a = Math.max(now, new Date(yy, 0, 1)), b = Math.min(end, new Date(yy + 1, 0, 1)), f = (b - a) / (365.25 * 864e5);
    if (f <= 0) continue;
    g *= Math.pow(1 + (by[yy] ?? lastV) / 100, f); T += f;
  }
  return {v: T > 0 ? (Math.pow(g, 1 / T) - 1) * 100 : lastV, src: `BCB Focus(${D.infl && D.infl.br ? D.infl.br.asof : "-"}) · 만기 ${C.tracked.venc}까지 연평균`};
}
// 과거 날짜 d 시점의 만기까지 연평균 IPCA 기대 (그날 이전 가장 최근 Focus 스냅샷 사용, 없으면 가장 오래된 것)
function inflAt(d) {
  const H = D.infl && D.infl.br && D.infl.br.history; if (!H) return inflBR().v;
  const ks = Object.keys(H).sort(); let k = ks[0];
  for (const x of ks) { if (x <= d) k = x; else break; }
  const [yy, mm, dd] = d.split("-").map(Number);
  return inflBR(new Date(yy, mm - 1, dd), H[k]).v;
}
// 환율 시나리오 x(BRL/KRW)에서의 총수익: 원화 기준, 달러 기준(USD/KRW 는 가정값 또는 현재 유지)
function views(m, x) {
  const inf = INF(), usd = D.fx_usd && D.fx_usd.latest ? D.fx_usd.latest[1] : null;
  const usdkrwNow = usd ? m.fx / usd : null, usdkrw = usdkrwNow;
  const krw = total(m.ytm, m.fx, x);
  const usdT = usd ? ((1 + m.ytm / 100) * (x / m.fx) * (usdkrwNow / usdkrw) - 1) * 100 : null;
  return {krw, krwReal: real(krw, inf.kr), usd: usdT, usdReal: usdT == null ? null : real(usdT, inf.us), usdkrwNow, usdkrw};
}
// 실질수익 0%가 되는 BRL/KRW (원화·달러 기준) — 이 아래로 환율이 내리면 물가를 감안한 구매력이 줄어듦
function breakeven(m) {
  const inf = INF(), v = views(m, m.fx);
  return {krw: m.fx * (1 + inf.kr / 100) / (1 + m.ytm / 100),
          usd: v.usdkrwNow ? m.fx * (1 + inf.us / 100) / (1 + m.ytm / 100) * v.usdkrw / v.usdkrwNow : null};
}
// 직전 영업일(국채 CSV 기준) 명목 YTM 대비 변동. 물가 기대는 동일하다고 보고 실질 변동을 계산
const dayChg = (m, nowNom, piPct, prevNom) => {
  if (prevNom == null || !m.before) return null;
  const d = (real(nowNom, piPct) - real(prevNom, piPct)) * 100;   // bp
  return {bp: d, txt: (d >= 0 ? "▲ +" : "▼ ") + f2(d, 1) + "bp", date: brDate(m.before[0])};
};
function realPanel(m) {
  const inf = INF(), br = inflBR(), v = views(m, m.fx), be = breakeven(m);
  const pv = m.before ? m.before[1] : null;   // 직전 영업일 명목 YTM (환율 유지 가정이므로 원·달러 행도 같은 YTM 기준)
  const row = (name, nom, pi, note) => { const c = dayChg(m, nom, pi, pv); return `<tr><td>${name}</td><td class=r>${pct(nom, 2)}</td><td class=r>${f2(pi)}%</td><td class=r style="font-weight:700">${pct(real(nom, pi), 2)}</td><td class=r>${c ? c.txt : "—"}</td><td><small>${note}</small></td></tr>`; };
  return `<div class=tbl><table class=mono><thead><tr><th>기준 통화</th><th class=r>명목 YTM ${RT.n}</th><th class=r>물가(연)</th><th class=r>실질 수익<br><small>물가 보정</small></th><th class=r>전일 대비</th><th>물가 가정</th></tr></thead><tbody>
    ${row("BRL 헤알 " + RT.r, m.ytm, br.v, "IPCA 기대 · " + br.src)}
    ${row("KRW 원 (환율 유지) " + RT.kr, v.krw, inf.kr, "한국 물가 " + f2(inf.kr) + "% (" + inf.kr_src + ")")}
    ${v.usd == null ? "" : row("USD 달러 (환율 유지) " + RT.r, v.usd, inf.us, "미국 물가 " + f2(inf.us) + "% (" + inf.us_src + ")")}</tbody></table></div>
    <div class=note>실질 = (1+명목) ÷ (1+물가) − 1 · 명목 YTM ${f2(m.ytm)}%는 1년 기준 연율 · 전일 대비는 ${m.before ? brDate(m.before[0]) : "직전"} 대비(물가 기대는 동일 가정). <b>원화 기준 실질 0% 손익분기 BRL/KRW ≈ ${f2(be.krw)}</b> (현재 ${f2(m.fx)}, ${pct((be.krw / m.fx - 1) * 100, 1)})${be.usd ? ` · 달러 기준 ≈ ${f2(be.usd)}` : ""} — 이보다 환율이 내리면 물가를 뺀 구매력이 줄어듭니다.
    ${v.usdkrwNow ? ` 달러 기준은 USD/KRW ${f2(v.usdkrw)}(현재 ${f2(v.usdkrwNow)} 유지)로 계산.` : ""} 한국 물가는 한국은행 소비자동향조사 3년 후 기대인플레이션율(ECOS, <b>가계 설문 기반이라 시장 기대보다 오차가 큼</b> · ${RT.kr} 수익에 모든 선택지 공통으로 반영돼 PF32·5:5·달러채 순위에는 영향 없음), 미국 물가는 미 국채 손익분기 인플레이션(명목−TIPS, 5·7년 평균, 시장 기대)이며 모두 자동 갱신됩니다${D.infl && D.infl.kr && D.infl.kr.cpi && D.infl.us && D.infl.us.cpi ? " (참고: 최근 CPI 전년동월비 한국 " + f2(D.infl.kr.cpi.v) + "% · 미국 " + f2(D.infl.us.cpi.v) + "%)" : ""}.</div>`;
}

// ---------- 공용 컴포넌트 ----------
function spark(vals, w = 560, h = 90, mark) {
  if (vals.length < 2) return "<div class=note>데이터 부족</div>";
  const mn = Math.min(...vals), mx = Math.max(...vals), sx = i => 4 + i * (w - 8) / (vals.length - 1), sy = v => h - 14 - (v - mn) / (mx - mn || 1) * (h - 28);
  const pts = vals.map((v, i) => sx(i).toFixed(1) + "," + sy(v).toFixed(1)).join(" ");
  const ml = mark != null ? `<line x1="0" x2="${w}" y1="${sy(mark)}" y2="${sy(mark)}" stroke="currentColor" stroke-dasharray="3 3" opacity=".6"/><text x="${w - 4}" y="${sy(mark) - 3}" text-anchor="end">${f2(mark)}</text>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="color:var(--ink)"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5"/>${ml}<text x="4" y="10">${f2(mx)}</text><text x="4" y="${h - 2}">${f2(mn)}</text></svg>`;
}

// 가격(PU, 좌축)과 수익률(명목·실질, 우축)을 한 차트에 겹쳐 그림
let chartSeq = 0; const CH = {};
function dualChart(pu, nom, rl, w = 560, h = 190, mark, dates, full, pn = "PU", lines = []) {
  const n = pu.length; if (n < 2) return "<div class=note>데이터 부족</div>";
  const M = 76, sx = i => M + i * (w - 2 * M) / (n - 1);   // 좌우 여백에 시작·끝 값 라벨을 넣는다
  const pmn = Math.min(...pu, ...lines.map(l => l.v)), pmx = Math.max(...pu, ...lines.map(l => l.v)), ymn = Math.min(...rl), ymx = Math.max(...nom);
  const sp = v => h - 16 - (v - pmn) / (pmx - pmn || 1) * (h - 30), sy = v => h - 16 - (v - ymn) / (ymx - ymn || 1) * (h - 30);
  const line = (arr, f, extra) => `<polyline points="${arr.map((v, i) => sx(i).toFixed(1) + "," + f(v).toFixed(1)).join(" ")}" fill="none" ${extra}/>`;
  const mk = mark != null && mark >= pmn && mark <= pmx ? `<line x1="${M}" x2="${w - M}" y1="${sp(mark)}" y2="${sp(mark)}" stroke="currentColor" stroke-dasharray="1 4" opacity=".7"/><text x="${M + 2}" y="${sp(mark) - 3}" font-size="9">지정가 ${f2(mark)}</text>` : "";
  // 시점 값 라벨: 각 곡선의 첫 점(좌)·마지막 점(우). 서로 겹치면 위아래로 밀어낸다
  const pack = ls => { ls.sort((a, b) => a.y - b.y); for (let i = 1; i < ls.length; i++) if (ls[i].y - ls[i - 1].y < 11) ls[i].y = ls[i - 1].y + 11; return ls; };
  const L = pack([{y: sp(pu[0]), t: pn + " " + f2(pu[0])}, {y: sy(nom[0]), t: "명목 " + f2(nom[0]) + "%"}, {y: sy(rl[0]), t: "실질 " + f2(rl[0]) + "%"}]);
  const R = pack([{y: sp(pu[n - 1]), t: pn + " " + f2(pu[n - 1])}, {y: sy(nom[n - 1]), t: "명목 " + f2(nom[n - 1]) + "%"}, {y: sy(rl[n - 1]), t: "실질 " + f2(rl[n - 1]) + "%"}]);
  const lab = (arr, x, anc) => arr.map(o => `<text x="${x}" y="${(o.y + 3).toFixed(1)}" text-anchor="${anc}" font-weight="700" font-size="10">${o.t}</text>`).join("");
  const dt = dates && dates.length === n ? `<text x="${M}" y="${h + 11}" text-anchor="middle">${dates[0]}</text><text x="${w - M}" y="${h + 11}" text-anchor="middle">${dates[n - 1]}</text>` : "";
  const id = "ch" + (++chartSeq);
  CH[id] = {n, M, w, h, pmn, pmx, ymn, ymx, pu, nom, rl, pn, full: full || dates || []};
  return `<svg id="${id}" viewBox="0 0 ${w} ${h + (dt ? 14 : 0)}" width="100%" style="color:var(--ink);font-family:inherit;font-size:11px;touch-action:pan-y">
    ${line(pu, sp, 'stroke="currentColor" stroke-width="1.6"')}
    ${line(nom, sy, 'stroke="currentColor" stroke-width="1" opacity=".38"')}
    ${line(rl, sy, 'stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 3"')}
    <g font-size="9" opacity=".55">${[[L, 2, "start", 9, f2(pmx)], [L, 2, "start", h - 2, f2(pmn)], [R, w - 2, "end", 9, f2(ymx) + "%"], [R, w - 2, "end", h - 2, f2(ymn) + "%"]]
      .filter(([ls, , , cy]) => !ls.some(o => Math.abs(o.y + 3 - cy) < 11)).map(([, x, anc, cy, t]) => `<text x="${x}" y="${cy}" text-anchor="${anc}">${t}</text>`).join("")}</g>
    ${lines.map(l => { const cv = l.c === "bad" ? "var(--bad)" : "var(--ok)"; return `<line x1="${M}" x2="${w - M}" y1="${sp(l.v)}" y2="${sp(l.v)}" style="stroke:${cv}" stroke-width="${l.c === "bad" ? 2 : 1.6}" stroke-dasharray="${l.c === "bad" ? "2.5 3.5" : "6 3"}"/><text x="${w - M - 3}" y="${sp(l.v) + (l.c === "bad" ? 12 : -4)}" text-anchor="end" font-size="10" font-weight="800" style="fill:${cv}">${l.t}</text>`; }).join("")}
    ${mk}${lab(L, M - 6, "end")}${lab(R, w - M + 6, "start")}${dt}
    <circle cx="${sx(0)}" cy="${sp(pu[0])}" r="2.2" fill="currentColor"/><circle cx="${sx(n - 1)}" cy="${sp(pu[n - 1])}" r="2.6" fill="currentColor"/><circle cx="${sx(n - 1)}" cy="${sy(rl[n - 1])}" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <g id="${id}c" visibility="hidden" pointer-events="none">
      <line id="${id}l" y1="2" y2="${h - 12}" stroke="currentColor" stroke-width="1" opacity=".55"/>
      <circle id="${id}p" r="3.4" fill="currentColor"/><circle id="${id}n" r="3" fill="var(--paper)" stroke="currentColor" opacity=".7"/><circle id="${id}r" r="3.4" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/>
      <g id="${id}t"><rect id="${id}b" rx="2" fill="var(--paper)" stroke="currentColor" stroke-width="1"/>
        <text id="${id}t0" font-weight="700" font-size="11"></text><text id="${id}t1" font-size="10.5"></text><text id="${id}t2" font-size="10.5"></text><text id="${id}t3" font-size="10.5" font-weight="700"></text></g></g>
    <rect x="0" y="0" width="${w}" height="${h + (dt ? 14 : 0)}" fill="transparent" onpointermove="chartHover(event,'${id}')" onpointerdown="chartHover(event,'${id}')" onpointerleave="chartLeave('${id}')" onpointercancel="chartLeave('${id}')" style="cursor:crosshair"/>
  </svg>`;
}

// 마우스·터치 위치의 날짜와 세 곡선의 값을 표시
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function chartHover(ev, id) {
  const c = CH[id], svg = document.getElementById(id); if (!c || !svg) return;
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());

function mkEdit(el) {   // 수동 확인 지표(브렌트유·프랑스-독일 금리 차) 저장: 값과 입력 날짜

  try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {}
  if (LOCAL) fetch("/api/config", {method: "POST", body: JSON.stringify(C)}).catch(() => {});
  render(true);
}

  const cal = D.cal; if (!cal || !cal.events) return "";

  const MK0 = C.mk || {}, AU = D.mkt || {}, kst = t => new Date(Date.parse(t.replace(" ", "T").replace("Z", ":00Z")) + 9 * 36e5).toISOString().slice(0, 16).replace("T", " ") + " KST", auOk = k => AU[k] && (Date.now() - Date.parse(AU[k].t.replace(" ", "T").replace("Z", ":00Z"))) < 3 * 864e5;   // 자동값(3일 이내)이 있으면 우선, 없으면 수동값
  const MK = {brent: auOk("brent") ? AU.brent.v : MK0.brent, frde: auOk("frde") ? AU.frde.v : MK0.frde, d: MK0.d}, mkAge = MK.d ? Math.round((Date.parse(td) - Date.parse(MK.d)) / 864e5) : null;
  const mkIn = (k, ph) => auOk(k) ? `<span title="${AU[k].src} · ${AU[k].t}">${f2(AU[k].v, k === "frde" ? 1 : 2)} <small style="opacity:.7">자동</small></span>` : `<input type=number step=any data-k="${k}" value="${MK[k] != null ? MK[k] : ""}" placeholder="${ph}" onchange="mkEdit(this)" style="width:78px;text-align:right;padding:2px 4px" class=noprint>`;
  const wrows = W ? [["원/달러", snap.usd, W.usdkrw_low != null && snap.usd != null && snap.usd < W.usdkrw_low, "&lt; " + W.usdkrw_low + " (외화 신규 축소)", 1], ["PF32 금리", m.ytm, (W.pf32_lo != null && m.ytm <= W.pf32_lo) || (W.pf32_hi != null && m.ytm >= W.pf32_hi), "≤ " + W.pf32_lo + " / ≥ " + W.pf32_hi, 2, true],
    ["헤알/원", m.fx, W.brl_low != null && m.fx < W.brl_low, "&lt; " + W.brl_low + " (헤알채 추가 매수 보류)", 2],

    ["프·독 10년물 금리 차(bp)" + (auOk("frde") ? "" : " 수동"), MK.frde != null ? MK.frde : null, W.frde_hi != null && MK.frde != null && MK.frde >= W.frde_hi, "≥ " + W.frde_hi + " (유럽 재정위기 확산)", 0, false, mkIn("frde", "bp")],

  const hit = wrows ? wrows.filter(r => r[2] && !r[5]) : [];

function reachTxt(bp) {   // 과거 '금리가 N영업일 안에 +bp 이상 오른 비율'(update.py yield_reach). 표에서 bp 이상인 가장 가까운 기준 사용(하한)
  const R = D.yield_reach; if (!R) return "—"; if (bp <= 0) return "현재가 이하(이미 충족)";

V.port = m => {

  const evs = comp.map(([, f]) => ev(f)), mn = comp.map(([, f]) => Math.min(...u.rows.map(f))), mx = comp.map(([, f]) => Math.max(...u.rows.map(f)));
  const top = arr => arr.indexOf(Math.max(...arr)), low = arr => arr.indexOf(Math.min(...arr));

    <div class=note style="margin-top:6px;padding-top:4px;border-top:1px solid var(--line);opacity:1;${i === bestFw ? "color:var(--ok);font-weight:700" : ""}">${fw.c[0].split("(")[0]} 시 연 ${RT.kr} <span class=mono>${pct(fw.e[i], 1)}</span>${i === bestFw ? " ✔ 최선" : ""}</div></div>`).join("");
  const rowsHtml = u.rows.map(o => { const v = comp.map(([, f]) => f(o)), bi = top(v);
    return `<tr><td style="white-space:normal">${o.x.name.split(" ")[0]} <small>${f2(o.x.w * 100, 0)}%</small></td>${v.map((x, j) => `<td class=r${hl(v, j)}>${pct(x, 1)}</td>`).join("")}<td>${nm[bi]}</td></tr>`; }).join("");

    <tr><td>투자금 ${f2(I.amt, 0)}만원 EV 손익</td>${evs.map(v => `<td class=r>${won(v)}</td>`).join("")}<td></td></tr></tbody></table></div>

    <li><b>내 보유 손익(원화)</b> — 설정 탭의 내 보유(매수가·투자금·매수일)가 있을 때만 맨 위에 나옵니다. 평가금액 = 투자금 × (현재가 ÷ 매수가) × (현재 환율 ÷ 매수 환율)이고, 손익을 <b>가격 손익</b>과 <b>환율 손익</b>으로 나눠 보여 줍니다(원화 명목: 물가 미보정). 달러채는 수령한 이자·경과이자가 빠지고 현재 가격이 입력 시세 이후 미 국채 금리 변동만 반영한 추정입니다. 세금·수수료·환전비용 미반영.</li>
    <li><b>손절 지표 박스</b> — 환율 가정 4종 최악에서 ${RT.kr}이 기준 미만인지(⚠/✔), 그리고 한계 환율·손절 환율. 기준(기본 4.5%)은 입력칸으로 수정합니다.</li>
    <li><b>체결 알림</b> — 02 탭의 다음 단계 지정가에 닿았는지.</li>
    <li><b>통화 경고와 환율 반영 비교표</b> — 패널의 YTM은 통화가 달라 직접 비교할 수 없음을 알리고, 환율 가정별 ${RT.kr}을 나란히 보여 줍니다.</li>
    <li><b>세 패널</b> — 큰 숫자(가격), YTM, 실질 YTM(현지통화 기준), 환율, 원화 평가 변동(가격×환율), 이중축 차트(가격 좌축, 명목 YTM 회색, 실질 YTM 점선, 초록 파선=매수선, 적색 점선=실질 4.5% 가격선, 점선=지정가). 아래 <b>막대 그래프</b>는 환율 가정별 ${RT.kr}(◎=현재 환율 유지, 빨간 세로선=손절선, 막대 옆 숫자=1년 뒤 환율).</li>
    <li><b>달러채 패널은 "추정"입니다</b> — 수동 입력 시세에 입력일 이후의 미 국채 금리 변동만 반영하고 가산금리는 고정합니다. 실제 호가와 다를 수 있습니다.</li>
    <li><b>하단 표</b> — 추적 종목(PF32, PF29, JS37, Selic)의 직전 대비 변화.</li></ul>
    <p class=note>"전일 대비"는 패널마다 비교 기준일이 다릅니다(국채 CSV 직전일 / 직전 미 국채 영업일). 각 항목에 날짜를 표시했습니다.</p>`},
  {k: "t02", t: "02 분할매수 — 계획과 실행", h: `
    <p><b>의도</b> — 한 번에 사지 않고 나눠 사는 계획(단계·가격·비중)을 관리하고, 계획이 현재 상황과 맞는지 점검합니다.</p>
    <ul>
    <li><b>단계 막대와 알림</b> — 체결 여부, 다음 미체결 단계의 지정가까지 남은 거리. 지정가 이하가 되면 "체결 조건 충족". 손절 환율 3% 이내로 근접하면 경고 박스.</li>
    <li><b>현재 평균(체결분)</b> — 실제로 체결한 단계만의 가중평균. 체결이 없으면 "—"입니다.</li>
    <li><b>전 단계 체결 시 예상 평균(가정)</b> — 아직 체결하지 않은 단계가 모두 <b>지정가에 체결된다고 가정</b>했을 때의 평균입니다. 실제 평균이 아닙니다.</li>
    <li><b>손절 기준 ·</b> ${RT.kr} — 01 손절 지표의 PF32 요약과 손절 환율.</li>
    <li><b>수익 소진 TARGET</b> — 실질 기준 입력칸. 헤알 실질이 이 값으로 줄어드는 PU 선과 현재가·평균 대비 거리.</li>
    <li><b>매수 사다리 제안</b> — 현 지정가·매수 기준선·손절 규칙 정합선의 PU, 현재 대비, 금리 상승폭, 실질, 손절 규칙 충족 여부, 과거 도달 빈도. 아래 버튼은 첫 미체결 단계를 이 가격들로 균등 분할합니다(확인 창 후 이 기기 설정에만 반영).</li>
    <li><b>만기 금액 계산</b> — 입력한 투자금(04-1 이자 계산·05와 공유)을 현재가·매수 기준선·정합선·사다리 평균에서 샀을 때의 <b>만기 수령액(BRL)</b>과 환율 가정별 <b>만기 원화</b>, 연 수익률, 현재 구매력 환산. PF32는 <b>이자가 없고 수익 전부가 할인차액</b>(만기 1,000 − 매수 PU)이라 쿠폰과 구분할 필요가 없습니다. 세전·수수료 미반영.</li></ul>
    <p class=note>체결가·날짜는 <b>설정 탭</b>에서 입력합니다. 체결 체크와 날짜를 입력해야 손절 환율이 평균 매수 환율을 기준으로 계산됩니다.</p>`},
  {k: "t03", t: "03 환율 — BRL/KRW", h: `
    <p><b>의도</b> — 헤알채의 원화 수익은 환율이 좌우합니다. 환율이 어느 수준에서 손익분기가 되는지, 손절 환율은 어디인지 한눈에 봅니다.</p>
    <ul><li><b>상단 위치바</b> — 현재 환율과 10년 범위.</li>
    <li><b>핵심 박스</b> — ${RT.kr} 손익분기 환율(그 아래로 가면 물가를 뺀 구매력이 줄어듦)과 손절 환율.</li>
    <li><b>실질수익률 표</b> — 헤알·원·달러 기준 실질(물가 가정은 자동 수집값과 출처를 표시).</li>
    <li><b>환율 표</b> — 환율별 총수익·실질. 손익분기·손절 환율·현재 환율 행이 강조됩니다.</li></ul>
    <p class=note>환율은 ECB 기준이라 주말·휴일에는 날짜가 그대로이고 하루 정도 지연됩니다.</p>`},
  {k: "t04", t: "04 시나리오 — 정치·재정과 환율 가정", h: `
    <p><b>의도</b> — "결과가 이렇게 나오면 어떤 선택이 유리한가"를 숫자로 비교합니다(결선 같은 큰 이벤트 대비).</p>
    <ul><li><b>04-1 정치·재정 시나리오</b> — 우파 승리/룰라 재선 등 4개 시나리오의 확률·금리·환율·가산금리 <b>가정</b>(접이식 "가정 수정"에서 직접 입력). 결과는 PF32(고정) vs Selic vs IPCA+의 12개월 손익, 시나리오별 최선 종목, 분할 방식 제안, 가격·만기수익률 예측, 금리·환율 민감도. 확인 후 매수 가정(결과 확인 뒤 진입, 충격은 매수가에 이미 반영).</li>
    <li><b>달러표시 브라질 국채 비교와 이자 계산</b> — 수동 입력 시세(5종)로 PF32와 비교. 시세가 3일 넘으면 경고가 뜹니다. 이자(배당)는 달러채만 발생합니다(PF32는 제로쿠폰).</li>
    <li><b>04-2 헤알채 vs 달러채</b> — 환율 가정별(기본값은 최근 5년 실제 환율에서 계산) ${RT.kr} 만기수익률. 환율 가정은 입력칸으로 수정, "기본값으로"로 되돌립니다. 아래에 가정별 과거 발생 구간과 3국 정권·주요 이벤트 표(인과관계를 단정할 수 없음).</li></ul>
    <p class=note>시나리오 확률과 환율·금리 반응은 <b>예측이 아니라 입력 가정</b>입니다. 모든 가정의 단일 출처는 이 탭입니다.</p>`},
  {k: "t05", t: "05 헤알·달러·5:5 비교 — 세 구성의 요약", h: `
    <p><b>의도</b> — 04의 가정과 계산을 그대로 모아 <b>헤알채 100% / 5:5 / 달러채 100%</b>를 나란히 비교합니다(새 계산 없음, 04와 숫자가 일치해야 함).</p>
    <ul><li><b>① 정치·재정 시나리오별</b>(04-1) — 시나리오별 12개월 원화 수익, EV, 실질, 최악·최선 폭, 투자금 기준 EV 손익. 진입 후 환율을 고정하므로 PF32의 환위험은 드러나지 않습니다.</li>
    <li><b>② 환율 가정별</b>(04-2) — 만기 보유 연율 ${RT.kr}. 5:5가 "헤알 약세 보험료(EV 일부 포기)로 하방을 방어하는 구조"임을 보여 줍니다.</li></ul>`},
  {k: "t06", t: "06 국채 전체 — Tesouro 상품 목록", h: `
    <p><b>의도</b> — 같은 기준일의 Tesouro Direto 전체 상품 가격·수익률을 확인하고, 추적 종목(PF32 등)을 맨 위에서 비교합니다. 검색창으로 종목을 찾습니다.</p>
    <p class=note>가격은 Investir CSV(매수 쪽 가격) 기준입니다. 직접 올린 CSV(상단 📂)가 더 최신이면 그것을 씁니다.</p>`},
  {k: "tset", t: "설정 — 분할매수 단계·내 보유", h: `
    <p><b>의도</b> — 개인 포지션(체결가·날짜·체결 여부)만 입력합니다. 나머지(물가·환율·시세)는 자동이고, 가정과 기준값은 각 탭에서 바로 수정합니다(설정은 최소화).</p>
    <ul><li><b>단계 표</b> — 비중%, 지정가(미체결) 또는 체결가(체결 후), 날짜(MM/DD, 체결 후), 체결 체크. 합이 100%가 되게 입력합니다. ＋단계 추가 / ✕삭제(단계 자체가 삭제됩니다. 체결 해제는 체크박스).</li>
    <li><b>내 보유(실제 매수 기록)</b> — 헤알채·달러채별 매수가, 투자금(만원), 매수일(YYYY-MM-DD 또는 MM/DD), 선택 입력인 매수 환율. 입력하면 01 탭 맨 위에 <b>원화 평가손익</b> 박스가 생깁니다. 매수일을 넣으면 그날의 환율을 자동으로 쓰고, 환율을 직접 넣으면 그 값이 우선하며, 둘 다 비우면 현재 환율로 보아 환율 손익이 0이 됩니다. 비워 두면 박스가 나타나지 않습니다.</li>
    <li><b>원화 입력 시뮬레이션</b> — 실제 매수와 무관한 가정 계산입니다. 투자금(만원), 가정 매수 PU, 가정 매수 환율(비우면 현재값), 선택으로 만기 환율을 넣으면 PF32를 만기까지 보유할 때 환율 가정 4종(및 직접 입력)별 <b>만기 원화 금액·손익·연 수익률(원화 명목·원화 실질)·현재 구매력 환산</b>이 나옵니다. 입력 즉시 계산되고 [저장] 없이 이 기기에 저장됩니다. 세금·수수료·환전비용·중도 매도 가격 차이는 반영하지 않습니다.</li>
    <li><b>저장</b> — 이 기기 브라우저에 저장됩니다(서버·GitHub로 전송되지 않음).</li>
    <li><b>설정 복사 / 붙여넣기</b> — 기기 간 이동(Mac→폰). Mac 앱(127.0.0.1)에서 복사 → 메신저 "나에게 보내기" → 폰에서 붙여넣기. 단계, 매수·손절·TARGET 기준, 시나리오·환율 가정 입력값, 이자 계산 입력이 함께 옮겨집니다. 개인 값이 들어 있으니 전달 후 메시지는 삭제하세요.</li></ul>`},
  {k: "alerts", t: "알림 체계 — 무엇이 언제 어디로 오나", h: `
    <div class=tbl><table><thead><tr><th>채널</th><th>내용</th><th>기준값 위치</th></tr></thead><tbody>
    <tr><td>앱 화면</td><td>01 알람 박스, 탭 🔔 개수, 02 체결 알림 — 앱을 열었을 때 실시간 계산</td><td>이 기기에 저장한 값</td></tr>
    <tr><td>Mac 알림센터</td><td>갱신 직후 새로 켜진 신호를 <b>상황별 점검 문구</b>와 함께 표시(매수 ON, 체결 조건, 손절 규칙 미달, 손절 환율 근접, TARGET 도달, 주 1회 점검). 전체 점검표는 data/last_alert.md</td><td>Mac 설정 파일(Mac 앱에서 저장한 값)</td></tr>
    <tr><td>GitHub 이슈(폰 푸시)</td><td>새 신호가 켜지면 봇이 이슈를 만들고 소유자를 @멘션·할당. 공개 저장소라 어떤 신호인지는 적지 않고 <b>전체 점검표</b>만 붙입니다.</td><td>저장소 변수 BUY_REAL, STOP_REAL, TARGET_REAL</td></tr></tbody></table></div>
    <ul><li>알림은 <b>"새로 켜질 때만"</b> 옵니다. 이미 켜져 있는 상태가 이어지는 동안은 조용합니다. 첫 실행은 상태만 저장합니다.</li>
    <li>갱신은 하루 두 번(Mac 07:00·19:00, GitHub 07:30·19:30 KST)이라 장중 급변은 반영되지 않습니다.</li>
    <li>앱에서 기준을 바꿔도 <b>서버 변수는 자동으로 바뀌지 않습니다.</b> 서버 알림 기준을 바꾸려면 저장소 Settings → Variables를 같이 수정합니다.</li>
    <li>폰 GitHub 앱에서 "직접 멘션"과 "할당됨" 알림을 켜 두세요.</li></ul>`},

  e.scrollIntoView({behavior: "smooth", block: "start"}); e.classList.remove("glflash"); void e.offsetWidth; e.classList.add("glflash");
}

const CFG_KEYS = ["stages", "target_real", "extra_fx_rows", "fx_range", "buy_real", "stop_real", "mk", "cal_plan", "cal_zone", "cal_watch", "pol", "usd_inc", "rc3", "pos", "sim"];
async function exportCfg() {
  const o = {}; CFG_KEYS.forEach(k => { if (C[k] !== undefined) o[k] = C[k]; });
  const t = JSON.stringify(o);
  try { await navigator.clipboard.writeText(t); $("#saved").textContent = "복사됨 ✓ (개인 설정 포함 — 전달 후 메신저에서 삭제하세요)"; }
  catch (e) { prompt("아래 내용을 복사하세요", t); }
}
function importCfg() {
  const t = prompt("복사한 설정(JSON)을 붙여넣으세요"); if (!t) return;
  let o; try { o = JSON.parse(t); } catch (e) { alert("형식이 올바르지 않습니다"); return; }
  if (!o || typeof o !== "object" || Array.isArray(o)) { alert("형식이 올바르지 않습니다"); return; }
  CFG_KEYS.forEach(k => { if (o[k] !== undefined) C[k] = o[k]; });
  try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {}
  render(); setTimeout(() => { const s = $("#saved"); if (s) s.textContent = "가져옴 ✓"; }, 50);
}

function readCfgInputs() {
  document.querySelectorAll("[data-k]").forEach(el => {
    const path = el.dataset.k.split("."); let o = C;
    path.slice(0, -1).forEach(p => o = o[p]);
    const k = path.at(-1), v = el.type === "checkbox" ? el.checked : el.type === "number" ? parseFloat(el.value) : el.value;
    if (typeof v === "number" && isNaN(v)) { o[k] = path[0] === "infl" ? 0 : null; return; }   // 빈 칸: 물가=0(자동), 그 외=미설정
    o[k] = v;
  });
}
function persistCfg() { try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {} if (LOCAL) fetch("/api/config", {method: "POST", body: JSON.stringify(C)}).catch(() => {}); render(); }
const renameStages = () => C.stages.forEach((x, k) => { x.name = "STAGE" + (k + 1); });
function stageAdd() { readCfgInputs(); C.stages.push({name: "", pct: 0, price: 0, date: "", filled: false}); renameStages(); persistCfg(); }
function stageDel(i) { readCfgInputs(); if (C.stages.length <= 1 || !confirm(`${C.stages[i].name} 단계를 삭제할까요?`)) return; C.stages.splice(i, 1); renameStages(); persistCfg(); }
function ladderApply() {   // 첫 미체결 단계를 [현 지정가 · 매수 기준 선 · 손절 규칙 정합선] 으로 분할(비중 균등)
  const m = model(), cb = consistentBuy(m), i = C.stages.findIndex(x => !x.filled);
  if (i < 0) { alert("미체결 단계가 없습니다."); return; }
  const S = C.stages[i], base = S.price > 0 ? S.price : m.price;
  const ps = [base, cb.sg.p1.line, cb.line[0]].map(x => Math.round(x * 100) / 100).filter(x => x <= base + 0.005).sort((a, b) => b - a).filter((x, k, a) => k === 0 || a[k - 1] - x > 0.5);   // 현 지정가 이하만, 0.5 BRL 이내 중복 제거
  const n = ps.length, each = Math.floor(S.pct / n), parts = ps.map((p, k) => ({name: "", pct: k === 0 ? S.pct - each * (n - 1) : each, price: p, date: "", filled: false}));
  if (n < 2) { alert("제안 가격이 현 지정가와 거의 같아 분할할 필요가 없습니다."); return; }
  if (!confirm(`${S.name}(${S.pct}%, 지정가 ${S.price})를 ${n}단계로 나눕니다:\n` + parts.map(x => `  ${x.pct}% @ ${f2(x.price)}`).join("\n") + "\n\n이 기기 설정에 저장됩니다. 계속할까요?")) return;
  C.stages.splice(i, 1, ...parts); renameStages(); persistCfg();
}
async function saveCfg() {
  readCfgInputs();
  try { localStorage.setItem("pf32cfg", JSON.stringify(C)); } catch (e) {}
  if (LOCAL) await fetch("/api/config", {method: "POST", body: JSON.stringify(C)}).catch(() => {});
  $("#saved").textContent = "저장됨 ✓"; setTimeout(() => render(), 600);
}

// 자동 갱신이 멈췄거나 실패했는지 화면에서 바로 알 수 있게 경고 (ECB 휴일·주말 4일까지는 정상으로 본다)
function staleWarn() {
  const days = s => Math.floor((Date.now() - new Date(s).getTime()) / 864e5);
  let w = "";
  if (D.status && D.status.fx !== "ok") w += " · ⚠ 환율 갱신 실패(이전 값 표시)";
  const fxd = D.fx && D.fx.latest && D.fx.latest[0];
  if (fxd && days(fxd) > 4) w += ` · ⚠ 환율 ${days(fxd)}일 지연`;
  if (days(D.generated) >= 3) w += ` · ⚠ 자동 갱신 ${days(D.generated)}일째 멈춤`;
  return w;
}

function render(keepFocus) {
  const sx = scrollX, sy = scrollY;
  let bell = ""; try { const sgn = buySignals(model()), c = [sgn.p1.on, sgn.p2.on, sgn.p3.on].filter(Boolean).length; bell = c ? " 🔔" + c : ""; } catch (e) {}
  $("#nav").innerHTML = TABS.map(([k, n]) => `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';localStorage.setItem('tab',tab);render()">${n}${k === "overview" ? bell : ""}</button>`).join("");
  const on = $("#nav .on"); if (on && !keepFocus) on.scrollIntoView({inline: "center", block: "nearest"});
  const m = model();
  $("#meta").textContent = `자동갱신 ${kst(D.generated)}${D.live_info ? " · CSV파일 " + D.live_info.mtime.slice(5).replace("T", " ") : ""} · ${C.tracked.label} ${f2(m.price)} / ${f2(m.ytm)}% · BRL/KRW ${f2(m.fx)}` +
    (D.status.treasury_csv !== "ok" ? " · ⚠ 국채 CSV 부분" : "") + staleWarn();
  const tl = keepFocus ? [...document.querySelectorAll("#app .tbl")].map(e => e.scrollLeft) : [];
  $("#app").innerHTML = (["overview", "stages", "fx", "scen", "port", "bonds"].includes(tab) ? rtLegend() : "") + V[tab](m) + (HELP_OF[tab] ? `<div class="noprint note" style="text-align:right;margin:0 0 10px"><a href="javascript:void 0" onclick="helpGo('${HELP_OF[tab]}')" style="color:inherit">ⓘ 이 탭의 설명서 보기 ▸</a></div>` : "");
  if (keepFocus) {
    const q = $("#q") || $("#hq"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    document.querySelectorAll("#app .tbl").forEach((e, i) => { if (tl[i]) e.scrollLeft = tl[i]; });
    scrollTo(sx, sy);   // 입력 수정 후 다시 그려도 화면 위치 유지
  }
}

// 좌우 스와이프로 탭 이동 (가로 스크롤 가능한 표·입력칸 위에서는 무시)
(() => {
  let x0, y0, t0, skip;
  const go = d => { const i = TABS.findIndex(t => t[0] === tab), n = TABS[i + d]; if (!n) return; tab = n[0]; try { localStorage.setItem("tab", tab); } catch (e) {} render(); scrollTo(0, 0); };
  document.addEventListener("touchstart", e => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    const el = e.target.closest ? e.target.closest(".tbl,input,nav") : null;
    skip = e.touches.length > 1 || (el && (el.matches("input,nav") || el.scrollWidth > el.clientWidth + 1));
  }, {passive: true});
  document.addEventListener("touchend", e => {
    if (skip || x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - t0 < 600) go(dx < 0 ? 1 : -1);
  }, {passive: true});
})();
